apiVersion: chartmanager.io/v1alpha1
kind: ChartWorkspace
metadata:
  name: lab-charts
spec:
  chartsDir: charts
  localCluster: .chart-manager/local-cluster.yaml
  renderDir: .chart-manager/rendered
  policiesDir: policies
  fanout:
    validation:
      - src/chart_manager/services/manifest_validation/**
      - src/chart_manager/integrations/helm.py
      - src/chart_manager/integrations/kubeconform.py
      - src/chart_manager/integrations/kyverno.py
    clusterTest:
      - src/chart_manager/**
      - .mise.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yaml
  clusterTest:
    sharedPrerequisites:
      - istio-base
