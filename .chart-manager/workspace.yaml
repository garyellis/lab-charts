apiVersion: chartmanager.io/v1alpha1
kind: ChartWorkspace
metadata:
  name: lab-charts
spec:
  chartsDir: charts
  localCluster: .chart-manager/local-cluster.yaml
  renderDir: .chart-manager/rendered
  policiesDir: policies
  validation:
    kubernetesVersion: "1.35.3"
    schemas:
      generateFromCRDs: true
      catalog:
        repository: datreeio/CRDs-catalog
        track: main
  fanout:
    validation:
      - src/chart_manager/commands/validate/**
      - src/chart_manager/integrations/helm.py
      - src/chart_manager/integrations/kubeconform/**
      - src/chart_manager/integrations/kyverno.py
    chartTest:
      - src/chart_manager/**
      - .mise.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yaml
  chartTest:
    sharedCharts:
      - istio-base
