apiVersion: local.cmg.io/v1alpha1
kind: LocalCluster
metadata:
  name: default
spec:
  cluster:
    config: kind-config.yaml
  bootstrap:
    releases:
      - type: lifecycle
        chart: charts/cilium
        profile: minimal
        runtimeValues:
          cilium.k8sServiceHost: "${kind.controlPlaneHost}"
          cilium.k8sServicePort: "${kind.controlPlanePort}"
        readiness:
          nodesReady: true
          workloadsReady:
            namespace: kube-system
            timeout: 15m
