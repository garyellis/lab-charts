[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chart-manager"
version = "0.1.0"
description = "Local and CI orchestration for lab Helm wrapper charts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "azure-cosmos>=4.16.1",
  "azure-identity>=1.25.3",
  "boto3>=1.43.33",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "rich>=13.9",
  "ruamel-yaml[oldlibyaml]>=0.19.1",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "vulture>=2.13",
  "pip-audit>=2.7",
  "import-linter>=2.15",
]

[project.scripts]
chart-manager = "chart_manager.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# No test module defines a Test*-named class; tests are plain functions.
# Disabling class collection keeps pytest from probing production classes
# (TestRequest, TestResult, ...) that test modules import.
python_classes = []
markers = ["integration: requires helm/kubeconform/kyverno on PATH"]
addopts = "-m 'not integration'"

# Line length 100 instead of default 88: the existing codebase has many
# lines in the 89-100 range that would be high-churn to rewrap during a
# polish pass. Format-on-save can tighten this later if desired.
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# G (flake8-logging-format) and LOG are selected at zero findings and enforce
# lazy %-formatting in log calls. Read the coverage honestly before relying on
# it: ruff recognizes a logger by the *name* it is called through, matching
# `logging`, `log`, `logger` and `LOG` but NOT the `_LOG` this repository binds
# in every module (verified against ruff 0.15). `logger-objects` does not close
# the gap either -- it resolves imported objects, and a logger bound in the
# module that uses it is a local binding with no qualified name to match. So G
# catches a bare `logging.info(f"...")` and any future `log`/`logger` binding,
# while the `_LOG.` call sites stay a convention this comment records rather
# than a rule the linter checks.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ARG", "G", "LOG"]

[tool.ruff.lint.per-file-ignores]
# Tests use `assert` (the whole point), frequently bind unused
# loop variables in parametrize patterns, and embed long fixture-string
# literals/long stub signatures that don't benefit from rewrapping.
# ARG: a test double only earns its keep by matching the real signature.
# Fakes, stubs and `lambda plan, *, dry_run: plan` callbacks accept the
# arguments the production caller passes and ignore the ones the assertion
# doesn't care about -- 196 of the 210 ARG findings when the rule was
# selected, none of them dead code. Renaming every one to `_arg` would make
# the doubles *less* readable than the interfaces they stand in for.
"tests/**/*.py" = ["S101", "B011", "E501", "ARG"]
# Typer CLI modules: `list[X] = []` is the documented typer pattern for
# repeatable options (B006), and `help=` strings for --options regularly
# exceed line length (E501). Both are local to argument declarations.
"src/chart_manager/{cli/*,commands/*/cli}.py" = ["B006", "E501"]
# UP042 (str+Enum -> StrEnum) is correct advice that must not be taken here.
# `BuildPhase`/`PromotionPhase` values are already persisted in DynamoDB and
# Cosmos. Under `str, Enum`, `str(PromotionPhase.MERGED)` is
# "PromotionPhase.MERGED"; under `StrEnum` it is "merged". Switching would
# change the serialized shape of rows that already exist, so the exemption is
# deliberate and belongs with the data, not in a lint backlog. Revisit only
# alongside a migration of the stored events.
"src/chart_manager/shared/events/model.py" = ["UP042"]
# ARG on signatures that are not ours to shorten. `NullEventStore.write` is
# the EventStore protocol's do-nothing implementation -- dropping the event
# *is* the behavior, and the parameter name is part of the contract it
# implements. `settings_customise_sources` is a pydantic-settings hook whose
# full source list is mandated by the framework; deliberately omitting
# `dotenv_settings` from the returned tuple is the decision documented in
# that method's docstring. Both are structural, not dead code, so they are exempted
# by code rather than left as a standing lint backlog.
"src/chart_manager/shared/events/store.py" = ["ARG002"]
"src/chart_manager/settings.py" = ["ARG003"]

[tool.ruff.format]
# Defaults: double-quote, 4-space indent, LF endings.
# Configured for future format runs; not auto-applied in this pass.

# Mypy: strict=false to start. Tightens are tracked separately;
# this is the initial baseline.
[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

# pip-audit: dependency vulnerability scanner (PyPA).
#
# pip-audit (as of 2.10) reads configuration ONLY from CLI flags — it does
# NOT read [tool.pip-audit] from pyproject.toml. Run via the `vuln-scan`
# mise task (.mise.toml) or directly:
#
#   uv run pip-audit --skip-editable
#
# Flag rationale:
#   --skip-editable
#       The local `chart-manager` package is installed editable and is not
#       on PyPI, so it cannot be audited. Skipping it is correct; without
#       this flag pip-audit emits a "Dependency not found on PyPI" skip
#       row (still exits 0, but noisy).
#
# Note on `--strict`: that flag only escalates *collection* failures (e.g.
# packages missing from PyPI) to a non-zero exit. It does NOT change how
# vulnerability findings are handled — pip-audit always exits non-zero on
# any vulnerability regardless of `--strict`. Combining `--strict` with
# `--skip-editable` is actively wrong here: the skipped editable package
# is treated as a collection failure under `--strict`.
#
# Ignored vulnerabilities: none currently. If a no-fix-available CVE
# surfaces, add `--ignore-vuln GHSA-xxxx-xxxx-xxxx` to the mise task with
# a comment naming the upstream tracking issue and a revisit date.

[tool.importlinter]
root_package = "chart_manager"

[[tool.importlinter.contracts]]
name = "Tiers point down"
type = "layers"
layers = ["chart_manager.main", "chart_manager.commands", "chart_manager.cli",
  "chart_manager.shared",
  "chart_manager.integrations | chart_manager.api | chart_manager.settings",
  "chart_manager.plumbing"]

[[tool.importlinter.contracts]]
name = "Shared: cluster is a composite over the charts and events leaves; workspace is the floor"
type = "layers"
containers = ["chart_manager.shared"]
layers = ["cluster", "charts | events", "workspace"]

[[tool.importlinter.contracts]]
name = "Integrations are independent"
type = "independence"
modules = ["chart_manager.integrations.*"]

[[tool.importlinter.contracts]]
name = "Leaf commands are independent; composites import only a leaf's root"
type = "independence"
modules = ["chart_manager.commands.*"]
ignore_imports = [
  "chart_manager.commands.plan.** -> chart_manager.commands.*",
  "chart_manager.commands.doctor.** -> chart_manager.commands.*",
]

[[tool.importlinter.contracts]]
name = "Composites never import each other"
type = "independence"
modules = ["chart_manager.commands.plan", "chart_manager.commands.doctor"]

[[tool.importlinter.contracts]]
name = "Command roots load no integration; validate's schema check is the one exception"
type = "forbidden"
source_modules = ["chart_manager.commands.*"]
forbidden_modules = ["chart_manager.integrations.**"]
as_packages = false
ignore_imports = [
  "chart_manager.commands.validate.schemas.store -> chart_manager.integrations.kubeconform.repository_snapshot",
]

[tool.vulture]
# Dead-code detection. min_confidence=80 keeps signal high; lower thresholds
# (60/70) produce many framework/decorator false positives (typer command
# bodies, pydantic field aliases) that are not worth triaging by hand.
paths = ["src/chart_manager", "tests"]
min_confidence = 80
sort_by_size = true
ignore_decorators = [
  "@app.command",
  "@*_app.command",
  "@typer.command",
  "@pytest.fixture",
  "@pytest.mark.*",
  "@model_validator",
  "@field_validator",
]
ignore_names = [
  # pytest convention
  "test_*",
  "fixture_*",
  "setup_*",
  "teardown_*",
  # pydantic / dataclass internals
  "model_config",
  "model_validator",
  "model_validate",
  # typer entry-point conventions
  "main",
  "callback",
  # pydantic `@field_validator` + `@classmethod` requires `cls` in the
  # signature; vulture sees the unreferenced local but the descriptor
  # protocol needs it.
  "cls",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.36",
]

[[tool.mypy.overrides]]
# Test code is annotated lightly: many fixtures use bare `dict` and the
# JSON renderer tests treat the result as `dict[str, Any]`. Relax the
# stricter checks here rather than forcing exhaustive annotations on
# tests that are clearer without them. The `test_*` glob targets the
# pytest module names; `tests.*` covers the integration subpackage.
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["misc", "index", "operator", "arg-type", "unused-ignore"]
