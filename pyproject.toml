[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chart-manager"
version = "0.1.0"
description = "Local and CI orchestration for lab Helm wrapper charts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "azure-cosmos>=4.16.1",
  "azure-identity>=1.25.3",
  "boto3>=1.43.33",
  "packaging>=24",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "rich>=13.9",
  "ruamel-yaml>=0.18",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "vulture>=2.13",
  "pip-audit>=2.7",
]

[project.scripts]
chart-manager = "chart_manager.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires helm/kubeconform/kyverno on PATH"]
addopts = "-m 'not integration'"

# Line length 100 instead of default 88: the existing codebase has many
# lines in the 89-100 range that would be high-churn to rewrap during a
# polish pass. Format-on-save can tighten this later if desired.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# TID251 (flake8-tidy-imports banned-api) is selected by code rather than as
# the whole TID family: TID252/TID253 are unrelated to the layering contract
# below and would add unowned findings to the existing lint backlog.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TID251"]

# --- layer contract: cli/ must not import integrations/ ------------------
#
# The shape being defended:
#
#     cli/surfaces -> services -> api + domain + integrations
#                              domain -> plumbing
#                                 api -> plumbing (pure helpers only)
#
# Read the arrows as guidance, not permission. `integrations/` shares a rank
# with `api/` and `domain/` because services depend on all three, not because
# an adapter should reach for an authored API type -- adapters are handed
# resolved service inputs.
#
# The surface layer (cli/, and any future REST/GraphQL/RPC/Slack surface)
# talks to services/ and plumbing/ only. Adapters are assembled in the
# composition root, `chart_manager.composition`, which is the single module
# outside integrations/ and services/ allowed to reach for an adapter. That
# is what lets a second surface be ~10 lines of container calls instead of a
# re-implementation of the CLI's wiring.
#
# The ban is declared globally and lifted per-directory below, so the default
# for any NEW top-level package is "may not import integrations" -- a new
# surface is guarded on the day it is created, without editing this table.
# `src/chart_manager/api/**` is the worked example: the versioned YAML
# contracts added in the configuration-API refactor are covered by the ban
# without an entry of their own, purely by being absent from the lift table
# below, and that absence is deliberate -- keep it.
#
# The other two arrows out of `api/` -- it may not import `chart_manager.
# services` or `chart_manager.cli` either -- are NOT expressible here, and the
# reason is the same one that pushed the `sys.exit` rule into a test.
# banned-api is a global table and per-file-ignores are per-code, so banning
# `chart_manager.services` to protect `api/` bans it for `cli/` as well, where
# importing services is the entire job: 92 violations, measured, all of them
# correct code. Those two arrows, plus "api/ imports nothing but stdlib,
# Pydantic and pure lexical helpers", "authored envelopes live under api/",
# "plumbing must not import api/" and "api/ raises ValueError, never
# SpecError", are enforced in tests/test_layering.py under heading (d).
#
# TID251 matches every import form against the package prefix:
#   from chart_manager.integrations.kubectl import Kubectl  -> flagged
#   from chart_manager.integrations import helm             -> flagged
#   import chart_manager.integrations.kubectl               -> flagged
#
# Enforced in CI by `uv run ruff check --select TID251 src/` (see the
# `layering` job in .github/workflows/ci.yaml and `mise run lint-layering`).
# The companion invariants -- services/ must not import rich/typer, sys.exit
# belongs to cli/ only, and the configuration API boundary described above --
# are enforced in tests/test_layering.py.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"chart_manager.integrations".msg = """not importable from this layer. \
Surfaces (cli/ and friends) depend on services/ + plumbing/ only; build \
configured adapters in `chart_manager.composition.Container` and pass the \
service in. If you need an integrations *type* for an annotation, re-export \
it from the owning service package (see HelmReleaseRef in \
services/helmrelease/__init__.py) rather than widening this rule."""

[tool.ruff.lint.per-file-ignores]
# Tests use `assert` (the whole point), frequently bind unused
# loop variables in parametrize patterns, and embed long fixture-string
# literals/long stub signatures that don't benefit from rewrapping.
# TID251: tests exercise adapters directly (fake CommandRunners against
# Helm/Kubectl/HelmReleaseClient) and assert on integration-level types;
# not a layer.
"tests/**/*.py" = ["S101", "B011", "E501", "TID251"]
# Typer CLI modules: `list[X] = []` is the documented typer pattern for
# repeatable options (B006), and `help=` strings for --options regularly
# exceed line length (E501). Both are local to argument declarations.
"src/chart_manager/cli/*.py" = ["B006", "E501"]
# UP042 (str+Enum -> StrEnum) is correct advice that must not be taken here.
# `BuildPhase`/`PromotionPhase` values are already persisted in DynamoDB and
# Cosmos. Under `str, Enum`, `str(PromotionPhase.MERGED)` is
# "PromotionPhase.MERGED"; under `StrEnum` it is "merged". Switching would
# change the serialized shape of rows that already exist, so the exemption is
# deliberate and belongs with the data, not in a lint backlog. Revisit only
# alongside a migration of the stored events.
"src/chart_manager/services/events/lifecycle.py" = ["UP042"]
# TID251 lift: the layers that are *supposed* to reach for adapters.
# integrations/ is the adapter layer itself; services/ owns the ports that
# wrap adapters; composition.py is the composition root, by definition the
# one place outside those two that wires them. Note cli/ is deliberately
# absent -- that is the whole point of the rule -- and so is api/, which
# describes authored YAML and has no business running a command.
"src/chart_manager/integrations/**/*.py" = ["TID251"]
"src/chart_manager/services/**/*.py" = ["TID251"]
"src/chart_manager/composition.py" = ["TID251"]

[tool.ruff.format]
# Defaults: double-quote, 4-space indent, LF endings.
# Configured for future format runs; not auto-applied in this pass.

# Mypy: strict=false to start. Tightens are tracked separately;
# this is the initial baseline.
[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

# pip-audit: dependency vulnerability scanner (PyPA).
#
# pip-audit (as of 2.10) reads configuration ONLY from CLI flags — it does
# NOT read [tool.pip-audit] from pyproject.toml. Run via the `vuln-scan`
# mise task (.mise.toml) or directly:
#
#   uv run pip-audit --skip-editable
#
# Flag rationale:
#   --skip-editable
#       The local `chart-manager` package is installed editable and is not
#       on PyPI, so it cannot be audited. Skipping it is correct; without
#       this flag pip-audit emits a "Dependency not found on PyPI" skip
#       row (still exits 0, but noisy).
#
# Note on `--strict`: that flag only escalates *collection* failures (e.g.
# packages missing from PyPI) to a non-zero exit. It does NOT change how
# vulnerability findings are handled — pip-audit always exits non-zero on
# any vulnerability regardless of `--strict`. Combining `--strict` with
# `--skip-editable` is actively wrong here: the skipped editable package
# is treated as a collection failure under `--strict`.
#
# Ignored vulnerabilities: none currently. If a no-fix-available CVE
# surfaces, add `--ignore-vuln GHSA-xxxx-xxxx-xxxx` to the mise task with
# a comment naming the upstream tracking issue and a revisit date.

[tool.vulture]
# Dead-code detection. min_confidence=80 keeps signal high; lower thresholds
# (60/70) produce many framework/decorator false positives (typer command
# bodies, pydantic field aliases) that are not worth triaging by hand.
paths = ["src/chart_manager", "tests"]
min_confidence = 80
sort_by_size = true
ignore_decorators = [
  "@app.command",
  "@*_app.command",
  "@typer.command",
  "@register",
  "@pytest.fixture",
  "@pytest.mark.*",
  "@model_validator",
  "@field_validator",
]
ignore_names = [
  # pytest convention
  "test_*",
  "fixture_*",
  "setup_*",
  "teardown_*",
  # pydantic / dataclass internals
  "model_config",
  "model_validator",
  "model_validate",
  # typer entry-point conventions
  "main",
  "callback",
  # pydantic `@field_validator` + `@classmethod` requires `cls` in the
  # signature; vulture sees the unreferenced local but the descriptor
  # protocol needs it.
  "cls",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.36",
]

[[tool.mypy.overrides]]
# Test code is annotated lightly: many fixtures use bare `dict` and the
# JSON renderer tests treat the result as `dict[str, Any]`. Relax the
# stricter checks here rather than forcing exhaustive annotations on
# tests that are clearer without them. The `test_*` glob targets the
# pytest module names; `tests.*` covers the integration subpackage.
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["misc", "index", "operator", "arg-type", "unused-ignore"]
