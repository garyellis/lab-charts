---
# Kind cluster blueprint for the chart-manager test cluster.
#
# Shaped by this repository's selected bootstrap: it runs cilium as CNI with full kube-proxy
# replacement, so the cluster is created with no default CNI and no
# kube-proxy. The generic LocalCluster bootstrap installs the repository's
# selected networking chart before the requested chart or stack runs --
# nodes stay NotReady until then, which is expected.
#
# extraPortMappings:
#   * 30080 -> 80   and  30443 -> 443
#       Consumed by `lab up`: charts/istio-gateway/values-lab.yaml pins
#       the istio-gateway Service to type=NodePort with nodePorts 30080
#       (http) and 30443 (https). The host reaches istio at
#       http://<app>.localhost and https://<app>.localhost with no
#       port-forward. VirtualServices on the istio-ingress/apps-gateway
#       then route to per-app Services (grafana, prometheus, ...).
#       Adding a new app is a wrapper-chart VirtualService change, not a
#       port-mapping change.
#
#   * 32092 -> 32092 and 32093 -> 32093
#       Consumed by charts/strimzi-kafka-operator/values-ci.yaml. Strimzi
#       exposes a kind-only NodePort listener where localhost:32092 is the
#       bootstrap endpoint and localhost:32093 is broker 0's advertised
#       endpoint for Mac-native Kafka clients.
#
# Other settings (extra mounts, etc.) can grow here as the lab stack
# adds workloads. This file is the single source of truth for the test
# cluster's topology and node image; chart-manager passes it through to Kind.
#
# CAVEAT: changing extraPortMappings requires `chart-manager local reset`.
# Kind bakes these into the node container spec at create time;
# `local down` + `local up` (docker stop/start) preserves the old
# container spec and the new mapping does not take effect.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
      - containerPort: 32092
        hostPort: 32092
        protocol: TCP
      - containerPort: 32093
        hostPort: 32093
        protocol: TCP
