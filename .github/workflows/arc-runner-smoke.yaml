name: ARC runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [kind, runner-scale-set]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        run: |
          echo "runner: ${RUNNER_NAME}"
          uname -a

      - name: Docker availability
        run: docker version
