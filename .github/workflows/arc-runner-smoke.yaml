name: ARC runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [kind, runner-scale-set]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install mise + tools
        uses: jdx/mise-action@v4

      - name: List charts
        run: uv run chart-manager charts list

      - name: Runner identity
        run: |
          echo "runner: ${RUNNER_NAME}"
          uname -a

      - name: Docker availability
        run: docker version
