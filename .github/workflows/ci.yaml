name: ci

# Combined PR/main pipeline:
#   chart-manager   → import contracts, `mise run check`, integration tests.
#   chart-contracts → chart source contracts and dashboard lint.
#   prep            → compute diff + sandbox chart matrix once.
#   validate        → static checks (helm template, kubeconform, kyverno) via CLI.
#   sandbox-test    → ephemeral kind cluster per chart, end-to-end install.
#   publish         → publish PR previews or final artifacts for merged chart changes.
#
# validate and sandbox-test run in parallel after prep — they're independent
# signals. `chart-manager plan` owns both validation
# selection and the sandbox chart/profile matrix, including repository-level
# safety fanout for kind config, tool pins, and workflow changes.
#
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      charts:
        description: "Charts to run: leave empty for diff-based (default), 'all' for every chart, or a comma/space-separated list (e.g. 'grafana,alloy'). Ignored when publish_all is enabled."
        type: string
        default: ""
      publish_all:
        description: "Validate, sandbox-test, and publish every chart as a release from main."
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # chart-manager's gates, as the mise tasks run them locally.
  chart-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install mise + tools
        uses: jdx/mise-action@v4

      - name: Import contracts
        run: mise run check:imports

      # check:imports already ran above.
      - name: Check
        run: mise run --skip-deps check

      # A missing tool fails the test instead of skipping it.
      - name: Integration tests
        run: mise run check:integration

  # Chart content, independent from chart-manager's gates.
  chart-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install mise + tools
        uses: jdx/mise-action@v4

      - name: Chart contracts
        run: mise run check:charts

  prep:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.diff.outputs.changed_files }}
      sandbox_matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.diff.outputs.mode }}
      chart_list_newline: ${{ steps.diff.outputs.chart_list_newline }}
      publish_charts: ${{ steps.diff.outputs.publish_charts }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Required for `git diff <base>...HEAD` (three-dot needs the merge-base).
          fetch-depth: 0

      - name: Install mise + tools
        uses: jdx/mise-action@v4

      - name: Compute changed files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CHARTS: ${{ inputs.charts }}
          DISPATCH_PUBLISH_ALL: ${{ inputs.publish_all }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # ---- Resolve dispatch mode --------------------------------------
          # Three modes the rest of the pipeline branches on:
          #   diff  → derive worklist from `git diff base...head` (default for
          #           push/PR, and for workflow_dispatch with empty input).
          #   all   → every chart under charts/ (workflow_dispatch only).
          #   list  → explicit chart names from the dispatch input.
          #
          # An empty-after-parse list (e.g. `charts: ","`) falls back to diff
          # rather than emitting an empty list-mode matrix — list-mode with
          # zero charts would silently no-op, which is worse than running the
          # default path.
          mode="diff"
          chart_list_newline=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_PUBLISH_ALL" == "true" ]]; then
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::publish_all must be dispatched from main."
                exit 1
              fi
              mode="all"
            fi

            # Trim leading/trailing whitespace once for the all-check and the
            # empty-check; per-element trimming happens in the awk parser.
            trimmed="$(printf '%s' "$DISPATCH_CHARTS" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            # Case-insensitive "all".
            lower="$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')"
            if [[ "$DISPATCH_PUBLISH_ALL" == "true" ]]; then
              : # publish_all already forced all-chart mode above.
            elif [[ "$lower" == "all" ]]; then
              mode="all"
            elif [[ -n "$trimmed" ]]; then
              # Split on commas + whitespace, drop empties, dedupe preserving
              # order. The `tr ',' ' '` + `tr -s '[:space:]' '\n'` chain also
              # collapses per-element whitespace (any internal space becomes
              # a record separator), so " grafana " and "grafana" both yield
              # the same token. awk's `!seen[$0]++` dedupes in first-seen
              # order, avoiding the non-determinism of `sort -u` across reruns.
              parsed="$(printf '%s' "$trimmed" \
                | tr ',' ' ' \
                | tr -s '[:space:]' '\n' \
                | awk 'NF && !seen[$0]++')"
              if [[ -z "$parsed" ]]; then
                echo "::warning::workflow_dispatch input parsed to an empty list; falling back to diff mode."
                mode="diff"
              else
                mode="list"
                chart_list_newline="$parsed"
              fi
            fi
          fi

          # Job-log only — the authoritative $GITHUB_OUTPUT write is below.
          echo "resolved dispatch mode: $mode"

          # ---- Compute diff (always — list/all also expose changed_files) -
          # We still run the diff for list/all so downstream steps that read
          # changed_files don't see an unexpectedly empty string. validate
          # ignores it in those modes; the value is informational there.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
            # New-branch / empty `before` is all-zeros; fall back to merge-base.
            # workflow_dispatch has no `before` at all, so this branch also
            # covers manual runs.
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              # checkout above uses fetch-depth: 0 so origin/main is already
              # present; no extra fetch needed for merge-base resolution.
              base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            fi
          fi

          tmp="$(mktemp)"
          if [[ -n "$base" ]]; then
            # No pathspec filter: validation and lifecycle impact analysis
            # both need to see the complete repository change set.
            git diff --name-only "${base}...${head}" > "$tmp" || true
          fi

          echo "changed files:"
          cat "$tmp" || true

          # Normal publishing is direct ownership only: any current chart with
          # a changed path is selected, independent of lifecycle/test fanout.
          # An explicit publish_all dispatch replaces that projection with the
          # full valid chart catalog. Computed here so an ordinary no-chart run
          # never reaches the publish job or contacts the registry at all.
          # `-o table` is required, not decorative. `plan`'s output default is
          # `auto`, which resolves to json whenever stdout is not a TTY or
          # CI=true -- i.e. always, here. This capture is read back with
          # `while IFS= read -r chart`, so it must be the newline-delimited
          # chart list that `table` projects, not a JSON array.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH_ALL" == "true" ]]; then
            # The catalog is the authoritative inventory. Invalid lifecycle
            # documents make `chart list` fail instead of silently omitting a
            # chart from a requested full publication.
            publish_charts="$(
              uv run chart-manager chart list -o json \
                | jq -r '.charts[] | select(.error == null) | .name'
            )"
          else
            publish_charts="$(
              uv run chart-manager plan --for publish -o table --changed-files "$tmp"
            )"
          fi

          # Multi-line outputs via random delimiter (avoids any chance of a
          # path/name collision with the EOF marker).
          delim="ghadelim_$(openssl rand -hex 8)"
          {
            echo "base=$base"
            echo "head=$head"
            echo "mode=$mode"
            echo "changed_files<<$delim"
            cat "$tmp"
            echo "$delim"
            echo "chart_list_newline<<$delim"
            printf '%s\n' "$chart_list_newline"
            echo "$delim"
            echo "publish_charts<<$delim"
            printf '%s\n' "$publish_charts"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Compute sandbox matrix
        id: matrix
        env:
          MODE: ${{ steps.diff.outputs.mode }}
          CHART_LIST: ${{ steps.diff.outputs.chart_list_newline }}
          BASE_SHA: ${{ steps.diff.outputs.base }}
        run: |
          set -euo pipefail

          emit() {
            echo "matrix=$1" >> "$GITHUB_OUTPUT"
            echo "matrix: $1"
          }

          args=()
          case "$MODE" in
            all)
              args=(--all)
              ;;
            list)
              while IFS= read -r chart; do
                [[ -n "$chart" ]] && args+=(--chart "$chart")
              done <<< "$CHART_LIST"
              ;;
            *)
              args=(--base "$BASE_SHA")
              ;;
          esac

          # Chart Manager owns safety fanout, dependentTests expansion, default
          # profile selection, and explicit-list validation. Fail loud if
          # matrix compilation errors; an empty success is a legitimate no-op.
          if ! matrix="$(uv run chart-manager plan -o github \
            "${args[@]}" 2>prep-stderr.txt)"; then
            {
              echo "### sandbox matrix prep failed"
              echo ""
              echo "\`chart-manager plan -o github\` exited non-zero. stderr:"
              echo ""
              echo "\`\`\`"
              cat prep-stderr.txt
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            cat prep-stderr.txt >&2
            exit 1
          fi
          emit "$matrix"

  validate:
    needs: prep
    runs-on: ubuntu-latest
    env:
      # Both schema sync and validation resolve the same XDG store. Keeping it
      # under the checked-out workspace makes the cached scope explicit and
      # avoids mixing it with unrelated tool caches under the runner account's
      # home directory.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide validation scope
        id: validation_scope
        env:
          MODE: ${{ needs.prep.outputs.mode }}
          CHANGED_FILES: ${{ needs.prep.outputs.changed_files }}
        run: |
          needed=false
          if [[ "$MODE" == all || "$MODE" == list || ! "$CHANGED_FILES" =~ [^[:space:]] ]]; then
            needed=true
          else
            # Only known non-runtime paths bypass repository verification.
            # Unknown paths stay conservative: local schemas and values can
            # live outside charts/. Python, tool pins and workflows must check.
            while IFS= read -r path; do
              case "$path" in
                ''|docs/*|*.md|tests/*|renovate.json|renovate-global.json) ;;
                *) needed=true; break ;;
              esac
            done <<< "$CHANGED_FILES"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [[ "$needed" == false ]]; then
            echo "Chart validation skipped: only documentation, tests or Renovate configuration changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install mise + tools
        if: steps.validation_scope.outputs.needed == 'true'
        uses: jdx/mise-action@v4

      - name: Restore locked schema generation
        id: schema_cache
        if: steps.validation_scope.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.cache/chart-manager/schemas/v3/repositories
          key: schema-repos-v3-${{ runner.os }}-${{ hashFiles('.chart-manager/schemas.lock.yaml') }}

      - name: Restore Helm dependencies
        id: dependency_cache
        if: steps.validation_scope.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.cache/chart-manager/helm-dependencies
          key: helm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.github/scripts/validation_cache.py') }}-${{ hashFiles('charts/**/Chart.yaml', 'charts/**/Chart.lock') }}
          restore-keys: |
            helm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.github/scripts/validation_cache.py') }}-

      # Restore only per-chart results. The merged schema tree is cheap to
      # rebuild; retaining it would accumulate every previous generation.
      - name: Restore derived CRD schemas
        id: derived_cache
        if: steps.validation_scope.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.cache/chart-manager/schemas/v3/derived/charts
          key: schema-derived-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('charts/**', 'src/chart_manager/**/*.py', '.chart-manager/**', '.mise.toml', 'pyproject.toml', 'uv.lock', '.github/scripts/validation_cache.py') }}
          restore-keys: |
            schema-derived-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Materialize cached Helm dependencies
        if: steps.validation_scope.outputs.needed == 'true'
        run: python .github/scripts/validation_cache.py restore-dependencies

      # Upstream sync never renders charts or changes the committed pins.
      # Derived CRD schemas are prepared automatically by validate.
      - name: Synchronize locked schemas
        id: schemas
        if: steps.validation_scope.outputs.needed == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          mise run schemas 2>&1 | tee schemas-output.txt
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo "## Schema preparation failed"
              echo
              echo "Run \`mise run schemas\` locally and address the error below. A render-only diagnostic run follows; schema validation remains blocked."
              echo
              echo '````text'
              tail -c 60000 schemas-output.txt
              echo
              echo '````'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # Persist completed downloads even if a later chart validation fails.
      - name: Save locked schema generation
        if: steps.schemas.outcome == 'success' && steps.schema_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/chart-manager/schemas/v3/repositories
          key: ${{ steps.schema_cache.outputs.cache-primary-key }}

      - name: Validate
        id: validate
        if: ${{ !cancelled() && steps.validation_scope.outputs.needed == 'true' }}
        # Don't fail-fast the job on a non-zero CLI exit: every post-step
        # (artifact upload, future post-processing) must run to completion
        # so the PR has full diagnostic context. The final "Gate" step below
        # converts steps.validate.outcome back into a job-level failure so
        # branch protection still blocks merge.
        continue-on-error: true
        env:
          MODE: ${{ needs.prep.outputs.mode }}
          CHANGED_FILES: ${{ needs.prep.outputs.changed_files }}
          CHART_LIST: ${{ needs.prep.outputs.chart_list_newline }}
          SCHEMAS_OUTCOME: ${{ steps.schemas.outcome }}
        run: |
          set -euo pipefail
          # `mise run validate` is the literal local command — CI parity by
          # construction. The CLI handles empty input as exit-0 with a notice,
          # so no skip-gate needed. --github-step-summary opts the CLI in to
          # appending its markdown summary to $GITHUB_STEP_SUMMARY (which GHA
          # always sets for each step); without the flag the CLI ignores the
          # env var, so local invocations don't surprise-write to it.
          # The CLI writes the markdown summary before it exits, so the PR
          # Checks tab gets the failure detail regardless of exit code.
          #
          # Mode dispatch mirrors prep:
          #   diff → --changed-files <tmp>   (existing default behavior)
          #   all  → --all                   (every chart; honors dispatch all)
          #   list → --chart X --chart Y ... (explicit dispatch list)
          args=()
          case "$MODE" in
            all)
              args=(--all)
              ;;
            list)
              while IFS= read -r c; do
                [[ -n "$c" ]] && args+=(--chart "$c")
              done <<< "$CHART_LIST"
              ;;
            *)
              tmp="$(mktemp)"
              printf '%s' "$CHANGED_FILES" > "$tmp"
              args=(--changed-files "$tmp")
              ;;
          esac
          if [[ "$SCHEMAS_OUTCOME" != success ]]; then
            args=(--all --check render)
          fi
          mise run validate -- "${args[@]}" --output all --keep --github-step-summary

      - name: Prepare validation caches for save
        if: steps.validate.outcome == 'success' && steps.schemas.outcome == 'success'
        run: |
          python .github/scripts/validation_cache.py stage-dependencies
          python .github/scripts/validation_cache.py prune-derived

      - name: Save Helm dependencies
        if: steps.validate.outcome == 'success' && steps.schemas.outcome == 'success' && steps.dependency_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/chart-manager/helm-dependencies
          key: ${{ steps.dependency_cache.outputs.cache-primary-key }}

      - name: Save derived CRD schemas
        if: steps.validate.outcome == 'success' && steps.schemas.outcome == 'success' && steps.derived_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/chart-manager/schemas/v3/derived/charts
          key: ${{ steps.derived_cache.outputs.cache-primary-key }}

      - name: Upload rendered manifests on failure
        # Use steps.validate.outcome, not `failure()`: with continue-on-error
        # on the validate step the JOB never enters "failure" state until the
        # gate fires, so `if: failure()` would never trigger here. `!cancelled()`
        # skips artifact upload during workflow cancellation (no point keeping
        # a half-rendered tree from a killed run).
        # CRD-discovery renders live in a temporary directory and are not part
        # of this artifact; upload only validation's retained render tree.
        if: ${{ !cancelled() && (steps.validate.outcome == 'failure' || steps.schemas.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: rendered-manifests-${{ github.run_id }}
          path: .chart-manager/rendered/
          if-no-files-found: ignore
          retention-days: 7

      - name: Gate — fail job if validate reported failures
        # Single explicit verdict step. `!cancelled()` runs the gate after any
        # non-cancellation outcome — including when a prior step (checkout,
        # mise install) errored, in which case steps.validate.outcome is ''
        # (skipped), the condition is false, and the job's overall status
        # reflects the earlier failure via normal GHA semantics. On cancel
        # we don't want to overwrite the cancel verdict with a "failed" row.
        if: ${{ !cancelled() && (steps.schemas.outcome == 'failure' || steps.validate.outcome == 'failure') }}
        run: |
          echo "schema preparation or validation found failures — failing job to block merge."
          exit 1

  sandbox-test:
    needs: prep
    if: needs.prep.outputs.sandbox_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prep.outputs.sandbox_matrix) }}
    env:
      # Route matrix.chart through env once and refer to $CHART in every shell
      # block, instead of literal-interpolating ${{ matrix.chart }} into bash.
      # Chart names come from Chart Manager's enabled cluster-test catalog;
      # routing through env keeps the shell blocks readable.
      CHART: ${{ matrix.chart }}
      PROFILE: ${{ matrix.profile }}
      # kind cluster names are DNS-1123 (≤63 chars). Existing chart/profile
      # names are short + DNS-safe, so `lab-<chart>-<profile>-<run_id>` fits.
      CLUSTER_NAME: lab-${{ matrix.chart }}-${{ matrix.profile }}-${{ github.run_id }}
    steps:
      # No fetch-depth: 0 — sandbox-test doesn't diff, default shallow clone
      # is enough and saves checkout time.
      - uses: actions/checkout@v6

      - name: Install mise + tools
        uses: jdx/mise-action@v4

      - name: Chart test
        id: sandbox
        env:
          # Only the Twingate chart's hooks get the admin API key.
          TWINGATE_API_TOKEN: ${{ matrix.chart == 'twingate-connector' && secrets.TWINGATE_API_TOKEN || '' }}
        run: |
          uv run chart-manager chart test "$CHART" \
            --profile "$PROFILE" \
            --cluster-name "$CLUSTER_NAME"

      # Capture diagnostics BEFORE teardown — once `kind delete` runs the API
      # server is gone and kubectl/helm produce nothing useful. The
      # belt-and-suspenders `steps.sandbox.outcome == 'failure'` gate is
      # intentional: we want diagnostics only when the sandbox step itself
      # failed, not when (say) a later teardown command fails.
      #
      # Asymmetry with the validate job is deliberate: sandbox is NOT
      # continue-on-error, so `failure()` correctly fires on a sandbox-step
      # failure and stays cleanly scoped to the install leg. Mirroring
      # validate's `!cancelled() && outcome == 'failure'` pattern here would
      # also fire diagnostics on later-step failures (teardown, summary),
      # which is the opposite of what we want.
      - name: Collect cluster diagnostics on failure
        if: failure() && steps.sandbox.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          mkdir -p sandbox-logs

          # Each network/API-touching command is wrapped in `timeout` so a
          # wedged kubectl/helm against a dead apiserver can't eat the 25m
          # job budget. continue-on-error above absorbs timeout's non-zero
          # exit if it ever fires.
          timeout 60 kubectl get events -A --sort-by=.lastTimestamp \
            > sandbox-logs/events.txt 2>&1
          timeout 60 kubectl get pods -A -o wide \
            > sandbox-logs/pods.txt 2>&1
          timeout 60 helm list -A \
            > sandbox-logs/helm-releases.txt 2>&1

          mkdir -p sandbox-logs/describe
          timeout 60 kubectl get pods -A \
            --field-selector=status.phase!=Running,status.phase!=Succeeded \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
            2>/dev/null \
          | while read -r ns name; do
              [[ -z "$ns" || -z "$name" ]] && continue
              timeout 30 kubectl describe pod -n "$ns" "$name" \
                > "sandbox-logs/describe/${ns}_${name}.txt" 2>&1
            done

          # kind export logs can hang if the docker-in-runner state is wedged.
          timeout 120 kind export logs sandbox-logs/kind --name "$CLUSTER_NAME" \
            > sandbox-logs/kind-export.txt 2>&1

          tar -czf "sandbox-logs-${CHART}-${PROFILE}.tar.gz" sandbox-logs

      - name: Upload diagnostics
        if: failure() && steps.sandbox.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-logs-${{ matrix.chart }}-${{ matrix.profile }}-${{ github.run_id }}
          path: sandbox-logs-${{ matrix.chart }}-${{ matrix.profile }}.tar.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Teardown (cleanup hooks, delete kind cluster)
        if: always()
        continue-on-error: true
        env:
          # Only the Twingate chart's hooks get the admin API key.
          TWINGATE_API_TOKEN: ${{ matrix.chart == 'twingate-connector' && secrets.TWINGATE_API_TOKEN || '' }}
        run: |
          uv run chart-manager chart teardown "$CHART" \
            --profile "$PROFILE" \
            --cluster-name "$CLUSTER_NAME"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.sandbox.outcome }}
        run: |
          # Default to "unknown" if the sandbox step was skipped (e.g.
          # checkout/mise install failed earlier) so the row stays readable.
          status="${OUTCOME:-unknown}"
          {
            echo "| chart | profile | result |"
            echo "| --- | --- | --- |"
            echo "| \`${CHART}\` | \`${PROFILE}\` | ${status} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prep, chart-manager, chart-contracts, validate, sandbox-test]
    if: >-
      ${{
        !cancelled() &&
        (
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          ) ||
            github.event_name == 'push'
            ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.publish_all &&
              github.ref == 'refs/heads/main'
            )
          ) &&
        needs.prep.outputs.publish_charts != '' &&
        needs.chart-manager.result == 'success' &&
        needs.chart-contracts.result == 'success' &&
        needs.validate.result == 'success' &&
        (needs.sandbox-test.result == 'success' || needs.sandbox-test.result == 'skipped')
      }}
    # ghcr.io is on the public internet and presents a publicly-trusted
    # certificate, so publishing no longer needs the private runner or the lab
    # root CA that Harbor required. Every chart dependency resolves from a
    # public upstream repo, so `helm dependency update` works here too.
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level `contents: read`, so both
    # keys are named here. `packages: write` is what lets GITHUB_TOKEN push to
    # ghcr.io; the fork guard in `if:` above is what keeps that grant off
    # pull requests from forks.
    permissions:
      contents: read
      packages: write
    env:
      # ghcr.io rejects an uppercase namespace. `repository_owner` is already
      # lowercase, so the fold in the publish step is defensive only.
      GHCR_NAMESPACE: ${{ github.repository_owner }}
      GHCR_PROJECT: ${{ vars.GHCR_PROJECT || 'charts' }}
      EVENT_NAME: ${{ github.event_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PUBLISH_CHARTS: ${{ needs.prep.outputs.publish_charts }}
      EVENTS_BACKEND: ${{ vars.EVENTS_BACKEND }}
      COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      # PRs package their head, never GitHub's synthetic merge ref. Pushes
      # package the checked-out main commit.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install mise + tools
        uses: jdx/mise-action@v4

      # No secret to provision: GITHUB_TOKEN is minted per run and the
      # `packages: write` grant above is the whole authorization story.
      # Routed through env rather than interpolated into the shell so the
      # token never appears in the rendered script.
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io \
                --username "$GHCR_USER" \
                --password-stdin

      - name: Publish selected charts
        run: |
          set -euo pipefail
          charts=()
          while IFS= read -r chart; do
            [[ -n "$chart" ]] && charts+=("$chart")
          done <<< "$PUBLISH_CHARTS"

          namespace="$(printf '%s' "$GHCR_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          repository="oci://ghcr.io/${namespace}/${GHCR_PROJECT:-charts}"
          # No --ca-file: ghcr.io's certificate chains to the runner's default
          # trust store, and the publisher omits helm's --ca-file flag entirely
          # when none is passed.
          publish_args=(
            --repository "$repository"
            --git-sha "$SOURCE_SHA"
            --operation-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            short_sha="${SOURCE_SHA:0:8}"
            publish_args+=(
              --version-suffix "pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}.g${short_sha}"
              --kind preview
              --build-correlation-id "${GITHUB_REPOSITORY}#${PR_NUMBER}"
              --pr-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            )
          else
            publish_args+=(--kind release)
          fi

          uv run chart-manager chart publish "${charts[@]}" "${publish_args[@]}"
