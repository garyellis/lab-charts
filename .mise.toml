[tools]
actionlint = "1.7.12"
# Match the package's declared minimum and the Ruff/mypy Python target.
python = "3.13"
# Renovate 43 requires Node 24; pin the current 24.x LTS instead of relying
# on whichever system Node happens to install the npm backend.
node = "24.18.0"
uv = "0.11.7"
dyff = "1.12.0"
flux2 = "2.9.3"
helm = "4.1.3"
kubectl = "1.35.3"
kind = "0.32.0"
kubeconform = "0.8.0"
kyverno = "1.18.1"
# libzip@3.2.2 was published without provenance in yarn's 2025-09-18 manual
# 16-package release (whole wave unattested, publisher is the project lead,
# tarball diff vs the attested 3.2.0 is clean bug fixes, no install hooks).
# Drop the exclusion when renovate resolves a re-attested libzip.
"npm:renovate" = { version = "43.281.0", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[tasks.setup]
description = "Install Python dependencies for the chart-manager CLI."
run = "uv sync --extra dev"

[tasks.test]
description = "Run the Python unit test suite."
run = "uv run --extra dev pytest"

[tasks.check]
description = "Run chart-manager's fast gates: import contracts, workflow lint, ruff, mypy, dead code, drift and unit tests."
depends = ["check:imports"]
run = [
  "actionlint .github/workflows/ci.yaml",
  "uv run --extra dev ruff check src/ tests/ .github/scripts/validation_cache.py",
  "uv run --extra dev mypy src/chart_manager",
  "uv run --extra dev vulture",
  "scripts/check-drift",
  "uv run --extra dev pytest -q",
]

[tasks."check:imports"]
description = "Enforce the [tool.importlinter] contracts."
run = "uv run --extra dev lint-imports"

[tasks."check:integration"]
description = "Run the integration tests against the real tools."
run = "uv run --extra dev pytest -q -m integration tests/integration"

[tasks."check:charts"]
description = "Check chart content: source contracts and Grafana dashboard lint."
run = [
  "scripts/check-chart-source-contracts",
  "uv run chart-manager grafana dashboard lint -o table",
]

[tasks.charts]
description = "List known chart wrappers."
run = "uv run chart-manager chart list"

[tasks.validate]
description = "Run the spec-driven repository validator. Usage: mise run validate -- --chart grafana --env dev"
run = "uv run chart-manager chart validate \"$@\""

[tasks.schemas]
description = "Cache pinned upstream schema repositories. Use --update only to advance upstream pins."
run = "uv run chart-manager schemas sync \"$@\""

[tasks."validate:clean"]
description = "Remove .chart-manager/rendered/ tree."
run = "uv run chart-manager chart cache clean"

[tasks."events:provision"]
description = "Create the configured events backend's Cosmos database/container or DynamoDB table (idempotent)."
run = "uv run python scripts/provision-event-store"

[tasks.vuln-scan]
description = "Scan installed Python deps against PyPI's vulnerability database (pip-audit)."
run = "uv run pip-audit --skip-editable"
