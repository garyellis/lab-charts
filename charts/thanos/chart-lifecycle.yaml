apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: thanos
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: thanos
    namespaceTemplate: "lab-${env}"
    environments:
      dev:
        values:
          - values.yaml
          - values-dev.yaml
      test:
        values:
          - values.yaml
          - values-test.yaml
      uat:
        values:
          - values.yaml
          - values-uat.yaml
      prod:
        values:
          - values.yaml
          - values-prod.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
      hub:
        values:
          - values.yaml
          - values-hub-observability.yaml
    triggers:
      "Chart.yaml":       [dev, test, uat, prod, ci, hub]
      "Chart.lock":       [dev, test, uat, prod, ci, hub]
      "values.schema.json": [dev, test, uat, prod, ci, hub]
      "values.yaml":      [dev, test, uat, prod, ci, hub]
      "values-dev.yaml":  [dev]
      "values-test.yaml": [test]
      "values-uat.yaml":  [uat]
      "values-prod.yaml": [prod]
      "values-ci.yaml":   [ci]
      "values-hub-observability.yaml": [hub]
      "templates/**":     [dev, test, uat, prod, ci, hub]
      "tests/**":         [dev, test, uat, prod, ci, hub]
      "chart-lifecycle.yaml": [dev, test, uat, prod, ci, hub]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install the infrastructure-only Thanos backend with Prometheus Operator CRDs and standalone RustFS.
        requires:
          - chart: prometheus-operator
            profile: minimal
          - chart: rustfs
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 20m

    dependentTests: []
