apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: thanos
spec:
  enabled: true
  validation:
    enabled: true
    # The upstream CI-only RustFS bucket-init Job does not expose pod/container
    # securityContext values, so it cannot satisfy the repository non-root rule.
    validators:
      policy: false
    releaseName: thanos
    namespaceTemplate: "lab-${env}"
    environments:
      dev:
        values:
          - values.yaml
          - values-dev.yaml
      test:
        values:
          - values.yaml
          - values-test.yaml
      uat:
        values:
          - values.yaml
          - values-uat.yaml
      prod:
        values:
          - values.yaml
          - values-prod.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":      [dev, test, uat, prod, ci]
      "values-dev.yaml":  [dev]
      "values-test.yaml": [test]
      "values-uat.yaml":  [uat]
      "values-prod.yaml": [prod]
      "values-ci.yaml":   [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Thanos Receive with Prometheus Operator CRDs and CI-local RustFS object storage.
        requires:
          - chart: prometheus-operator
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 20m

    dependentTests: []
