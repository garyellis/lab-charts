apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: flink-operator
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: flink-operator
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        namespace: flink-operator
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":     [ci]
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
      "templates/**":   [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install the Flink Kubernetes Operator with a sample FlinkDeployment and verify both become ready.
        namespace: flink-operator
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

    dependentTests: []
