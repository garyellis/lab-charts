{{- $testName := printf "%s-test" .Release.Name -}}
{{- $readyTestName := printf "%s-control-plane-ready" .Release.Name -}}
{{- $crdTestName := printf "%s-crds-installed" .Release.Name -}}
{{- $jobReadyTestName := printf "%s-flinkdeployment-ready" .Release.Name -}}
{{- $fd := .Values.flinkDeployment -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $testName }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $testName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $testName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $testName }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $testName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $testName }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $readyTestName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ $testName }}
  restartPolicy: Never
  containers:
    - name: kubectl
      image: registry.k8s.io/kubectl:v1.36.2
      command:
        - kubectl
        - wait
        - deployment/flink-kubernetes-operator
        - --for=condition=Available
        - --namespace={{ .Release.Namespace }}
        - --timeout=180s
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $crdTestName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ $testName }}
  restartPolicy: Never
  containers:
    - name: kubectl
      image: registry.k8s.io/kubectl:v1.36.2
      command:
        - kubectl
        - get
        - crd
        - flinkdeployments.flink.apache.org
        - flinksessionjobs.flink.apache.org
        - flinkstatesnapshots.flink.apache.org
        - flinkbluegreendeployments.flink.apache.org
{{- if $fd.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $jobReadyTestName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    # Run only after the operator and its CRDs have passed the tests above.
    # Creating the CR from inside this pod is intentional: rendering a
    # FlinkDeployment as a Helm resource makes a fresh install fail discovery
    # before Helm has installed the dependency chart's CRDs.
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ $testName }}
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kubectl
      # The test uses a shell so it can clean up the ephemeral FlinkDeployment
      # on both success and failure. The official kubectl image is distroless.
      image: docker.io/alpine/kubectl:1.36.2
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 65532
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu

          cleanup() {
            kubectl delete flinkdeployment {{ required "flinkDeployment.name is required" $fd.name | quote }} \
              --namespace={{ .Release.Namespace }} \
              --ignore-not-found \
              --wait=true \
              --timeout=180s || true
          }
          trap cleanup EXIT

          # Remove a resource left by an interrupted prior test before creating
          # this run's ephemeral sample.
          cleanup

          cat <<'EOF' | kubectl create -f -
          apiVersion: flink.apache.org/v1beta1
          kind: FlinkDeployment
          metadata:
            name: {{ required "flinkDeployment.name is required" $fd.name | quote }}
            namespace: {{ .Release.Namespace }}
          spec:
            image: {{ required "flinkDeployment.image is required" $fd.image | quote }}
            flinkVersion: {{ required "flinkDeployment.flinkVersion is required" $fd.flinkVersion }}
            serviceAccount: {{ $fd.serviceAccount | quote }}
{{- with $fd.flinkConfiguration }}
            flinkConfiguration:
{{ toYaml . | indent 14 }}
{{- end }}
            jobManager:
{{ toYaml $fd.jobManager | indent 14 }}
            taskManager:
{{ toYaml $fd.taskManager | indent 14 }}
{{- with $fd.job }}
            job:
{{ toYaml . | indent 14 }}
{{- end }}
          EOF

          kubectl wait \
            flinkdeployment/{{ $fd.name }} \
            --for=jsonpath='{.status.jobManagerDeploymentStatus}'=READY \
            --namespace={{ .Release.Namespace }} \
            --timeout=600s
{{- end }}
