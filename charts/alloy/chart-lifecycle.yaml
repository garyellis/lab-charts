apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: alloy
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: alloy
    namespaceTemplate: "lab-${env}"
    environments:
      dev:
        values:
          - values.yaml
          - values-dev.yaml
      test:
        values:
          - values.yaml
          - values-test.yaml
      uat:
        values:
          - values.yaml
          - values-uat.yaml
      prod:
        values:
          - values.yaml
          - values-prod.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":      [dev, test, uat, prod, ci]
      "values-dev.yaml":  [dev]
      "values-test.yaml": [test]
      "values-uat.yaml":  [uat]
      "values-prod.yaml": [prod]
      "values-ci.yaml":   [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Alloy with Prometheus Operator CRDs available and backend exports disabled or fixture-safe through CI values.
        requires:
          - chart: prometheus-operator
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

      telemetry:
        description: Install Alloy with the real metrics, logs, and traces backends it writes to.
        requires:
          - chart: prometheus-operator
            profile: minimal
          - chart: mimir-distributed
            profile: minimal
          - chart: loki
            profile: minimal
          - chart: tempo
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

      ui-e2e:
        description: Install Alloy with LGTM plus Grafana for full-stack UI-oriented validation.
        requires:
          - chart: prometheus-operator
            profile: minimal
          - chart: grafana
            profile: with-deps
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 20m

    dependentTests: []
