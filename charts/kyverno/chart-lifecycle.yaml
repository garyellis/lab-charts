apiVersion: chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: kyverno
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: kyverno
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        namespace: kyverno
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":           [ci]
      "Chart.lock":           [ci]
      "values.yaml":          [ci]
      "values-ci.yaml":       [ci]
      "templates/**":         [ci]
      "chart-lifecycle.yaml": [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: >-
          Install the Kyverno admission and reports controllers with fail-open
          webhooks and prove admission decides: a test-only ValidatingPolicy in
          Deny mode admits a Pod labelled verdict=allow and rejects its
          verdict=deny twin.
        namespace: kyverno
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    # The policy chart's resources are Kyverno CRs served by this chart.
    dependentTests:
      - chart: kyverno-policies
        profile: minimal
