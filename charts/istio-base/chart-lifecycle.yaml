apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: istio-base
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: istio-base
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install istio-base and verify the istio CRDs land in the cluster.
        namespace: istio-system
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests:
      - chart: istiod
        profile: minimal
      - chart: istio-gateway
        profile: minimal
