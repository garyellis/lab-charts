version: 1
enabled: true

manifestValidation:
  enabled: true
  releaseName: istio-base
  namespaceTemplate: "lab-${env}"
  environments:
    ci:
      values:
        - values.yaml
        - values-ci.yaml
  triggers:
    "values.yaml":    [ci]
    "values-ci.yaml": [ci]
  unmatchedChanges: warn

clusterTests:
  enabled: true
  profiles:
    minimal:
      description: Install istio-base and verify the istio CRDs land in the cluster.
      namespace: istio-system
      requires: []
      values:
        - values.yaml
        - values-ci.yaml
      helmTest: true
      checks:
        - name: crds-installed
          type: helm-test
          description: Verify the core istio CRDs (Gateway, VirtualService, etc.) are registered.
      timeout: 10m

  dependentTests:
    - chart: istiod
      profile: minimal
    - chart: istio-gateway
      profile: minimal
