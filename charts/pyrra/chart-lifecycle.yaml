apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: pyrra
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: pyrra
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Pyrra (SLO operator + API/UI) and verify it can reach the Mimir-backed Prometheus endpoint.
        namespace: pyrra
        requires:
          - chart: prometheus-operator
            profile: minimal
          - chart: mimir-distributed
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests: []
