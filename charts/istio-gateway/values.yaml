---
# values/istio-gateway.yaml
# Provider-neutral base values for the istio gateway wrapper chart.
# OpenStack HA placement and Service annotations are opt-in through
# values-openstack.yaml. Keeping the base placement maps empty lets consumers
# replace them with `{}`; Helm cannot erase nested maps inherited from a base.
# Apply values-ci.yaml on top to flatten these for a single-node kind cluster.

# The starter apps-tier Gateway (templates/apps-gateway.yaml). Enabled by
# default so a standalone install of this chart is immediately usable.
# Consumers that own their listener topology elsewhere -- e.g. the
# lab-openstack platform bootstrap, which scaffolds a role-aware Gateway per
# cluster (edge redirect vs workload ingress) -- set this to false and keep
# only the gateway workload from the upstream subchart.
appsGateway:
  enabled: true

# The self-signed CA chain and wildcard leaf in templates/cert-manager-ca.yaml.
# Enabled by default for the same reason: a standalone install needs some
# issuer to satisfy the apps-gateway credentialName. Consumers that already run
# a cert-manager issuing story (public ACME at an edge, a shared fleet CA in
# workload clusters) set this to false so the chart does not mint a second,
# competing root.
#
# Turning this off also drops the apps-wildcard leg of the helm test, which
# would otherwise wait forever on a Certificate that is no longer rendered.
certManager:
  enabled: true

# Apps-tier ingress domain. Drives the lab CA leaf cert (commonName +
# dnsNames) and the Gateway listener hosts. Per-app VirtualServices in
# other charts (grafana, etc.) consume the same appsDomain so VS hosts
# match the cert SANs and the gateway accepts them.
# Only read when appsGateway.enabled or certManager.enabled.
appsDomain: k8s.home.lab.io
appsHosts:
  - "*.home.lab"
  - "*.k8s.home.lab.io"

gateway:
  replicaCount: 1
  labels:
    istio: gateway-internal
  autoscaling:
    enabled: false

  service:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    # Keep provider annotations out of the base map. Helm deep-merges maps, so
    # a consumer cannot remove annotations inherited from this file with
    # `annotations: {}`. OpenStack consumers add values-openstack.yaml; other
    # providers can supply an empty map and a loadBalancerClass directly.
    annotations: {}
    ports:
      - name: status-port
        port: 15021
        protocol: TCP
        targetPort: 15021
      - name: http2
        port: 80
        protocol: TCP
        targetPort: 8080
      - name: https
        port: 443
        protocol: TCP
        targetPort: 8443

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1024Mi

  tolerations: []
  affinity: {}

# Cross-cutting VirtualServices for workloads installed before istio
# (e.g. cilium/hubble-ui). They cannot live in their own chart because
# the istio CRDs are not yet registered when that chart is applied.
routes:
  hubbleUi:
    enabled: true
    namespace: kube-system
    # namespace/name of the istio Gateway this VS binds to.
    gateway: istio-ingress/apps-gateway
    hosts:
      - hubble.k8s.home.lab
      - hubble.k8s.home.lab.io
