apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: istio-gateway
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: istio-gateway
    namespaceTemplate: "lab-${env}"
    environments:
      openstack:
        values:
          - values.yaml
          - values-openstack.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":            [openstack, ci]
      "Chart.lock":            [openstack, ci]
      "values.yaml":           [openstack, ci]
      "values-openstack.yaml": [openstack]
      "values-ci.yaml":        [ci]
      "templates/**":          [openstack, ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install istio-gateway (with starter Gateway + cert-manager ClusterIssuer + wildcard Certificate) on top of istio-base, istiod, and cert-manager.
        namespace: istio-ingress
        requires:
          - chart: cert-manager
            profile: minimal
          - chart: istio-base
            profile: minimal
          - chart: istiod
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

    dependentTests: []
