apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: istio-gateway
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: istio-gateway
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install istio-gateway (with starter Gateway + cert-manager ClusterIssuer + wildcard Certificate) on top of istio-base, istiod, and cert-manager.
        namespace: istio-ingress
        requires:
          - chart: cert-manager
            profile: minimal
          - chart: istio-base
            profile: minimal
          - chart: istiod
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

    dependentTests: []
