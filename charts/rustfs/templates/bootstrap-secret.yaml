{{- if .Values.bootstrap.enabled }}
{{- range $name, $tenant := (include "lab-rustfs.tenants" $ | fromYaml) }}
{{- $secret := $tenant.workloadSecret }}
{{- if $secret.create }}
{{- $accessKey := required (printf "bootstrap.tenants.%s.workloadSecret.accessKey is required when create=true" $name) $secret.accessKey }}
{{- $secretKey := required (printf "bootstrap.tenants.%s.workloadSecret.secretKey is required when create=true" $name) $secret.secretKey }}
{{- if or (eq $accessKey "rustfsadmin") (eq $secretKey "rustfsadmin") }}
{{- fail (printf "bootstrap.tenants.%s workload credentials must not use RustFS defaults" $name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lab-rustfs.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ $secret.accessKeyKey }}: {{ $accessKey | quote }}
  {{ $secret.secretKeyKey }}: {{ $secretKey | quote }}
{{- end }}
{{- end }}
{{- end }}
