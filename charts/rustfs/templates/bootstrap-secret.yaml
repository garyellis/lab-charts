{{- if and .Values.bootstrap.enabled .Values.bootstrap.workloadSecret.create }}
{{- $accessKey := required "bootstrap.workloadSecret.accessKey is required when create=true" .Values.bootstrap.workloadSecret.accessKey }}
{{- $secretKey := required "bootstrap.workloadSecret.secretKey is required when create=true" .Values.bootstrap.workloadSecret.secretKey }}
{{- if or (eq $accessKey "rustfsadmin") (eq $secretKey "rustfsadmin") }}
{{- fail "bootstrap workload credentials must not use RustFS defaults" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "bootstrap.workloadSecret.name is required" .Values.bootstrap.workloadSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-rustfs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.bootstrap.workloadSecret.accessKeyKey }}: {{ $accessKey | quote }}
  {{ .Values.bootstrap.workloadSecret.secretKeyKey }}: {{ $secretKey | quote }}
{{- end }}
