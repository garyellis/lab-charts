{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lab-rustfs.fullname" . }}-bootstrap-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-rustfs.labels" . | nindent 4 }}
data:
  {{- range $name, $tenant := (include "lab-rustfs.tenants" . | fromYaml) }}
  {{- $bucketArns := list }}
  {{- $objectArns := list }}
  {{- range $tenant.buckets }}
  {{- $bucketArns = append $bucketArns (printf "arn:aws:s3:::%s" .) }}
  {{- $objectArns = append $objectArns (printf "arn:aws:s3:::%s/*" .) }}
  {{- end }}
  {{ $name }}.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": {{ toJson $bucketArns }}
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:AbortMultipartUpload",
            "s3:DeleteObject",
            "s3:GetObject",
            "s3:ListMultipartUploadParts",
            "s3:PutObject"
          ],
          "Resource": {{ toJson $objectArns }}
        }
      ]
    }
  {{- end }}
{{- end }}
