{{- if .Values.bootstrap.enabled }}
{{- $tenants := include "lab-rustfs.tenants" . | fromYaml }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lab-rustfs.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-rustfs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "lab-rustfs.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: RC_CONFIG_DIR
              value: /tmp/rc
            - name: ENDPOINT
              value: {{ .Values.bootstrap.endpoint | quote }}
            - name: ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "bootstrap.adminSecret.name is required" .Values.bootstrap.adminSecret.name }}
                  key: {{ .Values.bootstrap.adminSecret.accessKeyKey }}
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.adminSecret.name }}
                  key: {{ .Values.bootstrap.adminSecret.secretKeyKey }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              rc alias set store "$ENDPOINT" "$ADMIN_ACCESS_KEY" "$ADMIN_SECRET_KEY"
              until rc ready store --timeout 5; do
                echo "waiting for RustFS readiness"
                sleep 3
              done
              # New connections to the Service fail intermittently while the
              # pod's networking settles, so every rc call is retried.
              retry_rc() {
                attempt=1
                until "$@"; do
                  command_status=$?
                  if [ "$attempt" -ge 10 ]; then
                    echo "rc operation failed after $attempt attempts" >&2
                    return "$command_status"
                  fi
                  attempt=$((attempt + 1))
                  sleep 2
                done
              }

              # Create, or update when the key already exists. A lost response
              # can leave either state behind, so the pair converges on retry.
              upsert_service_account() {
                rc admin service-account create store \
                  "$access_key" "$secret_key" \
                  --policy "/policy/$tenant.json" --description "$description" ||
                rc admin service-account update store "$access_key" \
                  --secret-key "$secret_key" \
                  --policy "/policy/$tenant.json" --description "$description"
              }

              # Each tenant's workload Secret is projected at /tenants/<tenant>.
              reconcile_tenant() {
                tenant="$1"
                description="$2"
                shift 2
                access_key="$(cat "/tenants/$tenant/access-key")"
                secret_key="$(cat "/tenants/$tenant/secret-key")"
                for bucket in "$@"; do
                  retry_rc rc mb --ignore-existing "store/$bucket"
                done
                retry_rc upsert_service_account
              }
              {{- range $name, $tenant := $tenants }}
              reconcile_tenant {{ $name | squote }} {{ $tenant.description | squote }}{{ range $tenant.buckets }} {{ . | squote }}{{ end }}
              {{- end }}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: tenants
              mountPath: /tenants
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: {{ include "lab-rustfs.fullname" . }}-bootstrap-policy
        - name: tenants
          projected:
            sources:
              {{- range $name, $tenant := $tenants }}
              - secret:
                  name: {{ $tenant.workloadSecret.name }}
                  items:
                    - key: {{ $tenant.workloadSecret.accessKeyKey }}
                      path: {{ $name }}/access-key
                    - key: {{ $tenant.workloadSecret.secretKeyKey }}
                      path: {{ $name }}/secret-key
              {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
