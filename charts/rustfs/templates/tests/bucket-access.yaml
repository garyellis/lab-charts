{{- if .Values.bootstrap.enabled }}
{{- range $name, $tenant := (include "lab-rustfs.tenants" . | fromYaml) }}
{{- with $ }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lab-rustfs.fullname" . }}-{{ $name }}-bucket-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-rustfs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: bucket-access
      image: "{{ .Values.tests.bucketAccess.image.repository }}:{{ .Values.tests.bucketAccess.image.tag }}"
      imagePullPolicy: {{ .Values.tests.bucketAccess.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
      env:
        - name: ENDPOINT
          value: {{ .Values.bootstrap.endpoint | quote }}
        - name: BUCKETS
          value: {{ join " " $tenant.buckets | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ $tenant.workloadSecret.name }}
              key: {{ $tenant.workloadSecret.accessKeyKey }}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $tenant.workloadSecret.name }}
              key: {{ $tenant.workloadSecret.secretKeyKey }}
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_CONFIG_FILE
          value: /tmp/aws-config
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        - name: AWS_PAGER
          value: ""
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
        - name: HOME
          value: /tmp
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          printf '[default]\ns3 =\n    addressing_style = path\n' > "$AWS_CONFIG_FILE"

          retry_aws() {
            attempt=1
            until "$@"; do
              command_status=$?
              if [ "$attempt" -ge 10 ]; then
                echo "S3 operation failed after $attempt attempts" >&2
                return "$command_status"
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
          }

          # Validated bucket names contain no whitespace or glob characters.
          for BUCKET in $BUCKETS; do
            retry_aws aws s3api head-bucket \
              --endpoint-url "$ENDPOINT" --bucket "$BUCKET" >/dev/null

            object_key="helm-test/${HOSTNAME}-$(date +%s%N)"
            payload=/tmp/payload
            downloaded=/tmp/downloaded
            printf 'rustfs bucket access test: %s\n' "$object_key" > "$payload"

            cleanup() {
              aws s3api delete-object \
                --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key "$object_key" \
                >/dev/null 2>&1 || true
            }
            trap cleanup EXIT INT TERM

            retry_aws aws s3api put-object \
              --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key "$object_key" \
              --body "$payload" >/dev/null
            retry_aws aws s3api get-object \
              --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key "$object_key" \
              "$downloaded" >/dev/null

            expected_hash="$(sha256sum "$payload")"
            expected_hash="${expected_hash%% *}"
            actual_hash="$(sha256sum "$downloaded")"
            actual_hash="${actual_hash%% *}"
            test "$actual_hash" = "$expected_hash"

            retry_aws aws s3api delete-object \
              --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key "$object_key" \
              >/dev/null
            trap - EXIT INT TERM
          done
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        {{- toYaml .Values.tests.bucketAccess.resources | nindent 8 }}
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
