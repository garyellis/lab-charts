apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: rustfs
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: rustfs
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":                [ci]
      "values.yaml":               [ci]
      "values-ci.yaml":            [ci]
      "templates/**":              [ci]
      "chart-lifecycle.yaml":      [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install standalone RustFS and verify bucket-scoped Thanos credentials.
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

    dependentTests:
      - chart: thanos
        profile: minimal
