---
bootstrap:
  adminSecret:
    # With no existingSecret, the upstream chart creates this CI-only Secret.
    name: rustfs-secret
  # Cluster tests install this chart as the shared object store for every
  # consumer that requires it, so CI provisions all of their tenants.
  tenants:
    thanos:
      workloadSecret:
        create: true
        accessKey: ci-thanos
        secretKey: ci-thanos-secret-not-for-production
    loki:
      description: Loki object-store access
      buckets:
        - loki-chunks
        - loki-ruler
      workloadSecret:
        name: rustfs-loki
        accessKeyKey: accessKey
        secretKeyKey: secretKey
        create: true
        accessKey: ci-loki
        secretKey: ci-loki-secret-not-for-production
    mimir:
      description: Mimir object-store access
      buckets:
        - mimir-blocks
        - mimir-ruler
        - mimir-alertmanager
      workloadSecret:
        name: rustfs-mimir
        accessKeyKey: accessKey
        secretKeyKey: secretKey
        create: true
        accessKey: ci-mimir
        secretKey: ci-mimir-secret-not-for-production
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

rustfs:
  # CI is the only environment allowed to render credentials through Helm.
  secret:
    existingSecret: ""
    allowInsecureDefaults: false
    rustfs:
      access_key: ci-rustfs-root
      secret_key: ci-rustfs-root-secret-not-for-production

  storageclass:
    name: standard
    dataStorageSize: 256Mi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
