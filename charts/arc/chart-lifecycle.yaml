apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: arc
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: arc
    environments:
      ci:
        namespace: arc-systems
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":     [ci]
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
    unmatchedChanges: all-environments

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install the GitHub ARC controller CRDs and manager in arc-systems.
        namespace: arc-systems
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests: []
