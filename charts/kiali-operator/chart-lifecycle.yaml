apiVersion: chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: kiali-operator
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: kiali-operator
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        namespace: kiali-operator
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":     [ci]
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
      "templates/**":   [ci]
    unmatchedChanges: warn

  chartTest:
    enabled: true
    profiles:
      minimal:
        description: Install the operator behind the shared apps gateway (Kiali CR + VirtualService) and verify the operator, CRD, and route.
        namespace: kiali-operator
        requires:
          - chart: istio-gateway
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

    dependentTests: []
