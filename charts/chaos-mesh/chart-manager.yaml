version: 1
enabled: true

manifestValidation:
  enabled: true
  releaseName: chaos-mesh
  namespaceTemplate: "lab-${env}"
  environments:
    ci:
      values:
        - values.yaml
        - values-ci.yaml
  triggers:
    "values.yaml":    [ci]
    "values-ci.yaml": [ci]
  unmatchedChanges: warn

clusterTests:
  enabled: true
  profiles:
    minimal:
      description: Install Chaos Mesh (controller-manager, chaos-daemon, dashboard) and verify rollout.
      namespace: chaos-mesh
      requires: []
      values:
        - values.yaml
        - values-ci.yaml
      helmTest: true
      timeout: 10m

  dependentTests: []
