apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: grafana
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: grafana
    namespaceTemplate: "lab-${env}"
    environments:
      dev:
        values:
          - values.yaml
          - values-dev.yaml
      test:
        values:
          - values.yaml
          - values-test.yaml
      uat:
        values:
          - values.yaml
          - values-uat.yaml
      prod:
        values:
          - values.yaml
          - values-prod.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":      [dev, test, uat, prod, ci]
      "values-dev.yaml":  [dev]
      "values-test.yaml": [test]
      "values-uat.yaml":  [uat]
      "values-prod.yaml": [prod]
      "values-ci.yaml":   [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Grafana with CI-local values. Requires istio-base for the VirtualService CRD.
        requires:
          - chart: istio-base
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

      with-deps:
        description: Install Grafana with LGTM datasources available.
        requires:
          - chart: istio-base
            profile: minimal
          - chart: mimir-distributed
            profile: minimal
          - chart: loki
            profile: minimal
          - chart: tempo
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 15m

    dependentTests: []
