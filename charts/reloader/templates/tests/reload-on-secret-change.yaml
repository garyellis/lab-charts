{{- /*
Proves the controller's actual contract, not just that its pod is Ready:
  1. a Deployment annotated secret.reloader.stakater.com/reload=<secret> rolls
     when that Secret's data changes, via the annotations reload strategy;
  2. an unannotated Deployment mounting the same Secret is left untouched
     (opt-in only, autoReloadAll=false).
Helm runs test hooks in weight order; init containers serialize the steps.
*/ -}}
{{- $name := printf "%s-reload-test" .Release.Name | trunc 50 | trimSuffix "-" -}}
{{- $annotated := printf "%s-annotated" $name -}}
{{- $unannotated := printf "%s-unannotated" $name -}}
{{- $kubectl := printf "%s:%s" .Values.tests.kubectlImage.repository .Values.tests.kubectlImage.tag -}}
{{- $timeout := printf "--timeout=%s" .Values.tests.timeout -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $annotated | quote }}, {{ $unannotated | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  value: initial
{{- range $deployment := list (dict "name" $annotated "optIn" true) (dict "name" $unannotated "optIn" false) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deployment.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- if $deployment.optIn }}
    secret.reloader.stakater.com/reload: {{ $name | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $deployment.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $deployment.name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload
          image: "{{ $.Values.tests.workloadImage.repository }}:{{ $.Values.tests.workloadImage.tag }}"
          command: ["sleep", "86400"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          volumeMounts:
            - name: watched
              mountPath: /etc/watched
              readOnly: true
      volumes:
        - name: watched
          secret:
            secretName: {{ $name }}
{{- end }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ $name }}
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: wait-initial-rollout
      image: {{ $kubectl }}
      command: ["kubectl", "rollout", "status", "deployment/{{ $annotated }}", "--namespace={{ .Release.Namespace }}", {{ $timeout | quote }}]
      securityContext: &containerSecurityContext
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    - name: rotate-secret
      image: {{ $kubectl }}
      command: ["kubectl", "patch", "secret/{{ $name }}", "--namespace={{ .Release.Namespace }}", "--type=merge", "--patch={\"stringData\":{\"value\":\"rotated\"}}"]
      securityContext: *containerSecurityContext
    - name: wait-reloader-patch
      image: {{ $kubectl }}
      command:
        - kubectl
        - wait
        - deployment/{{ $annotated }}
        - --namespace={{ .Release.Namespace }}
        - '--for=jsonpath={.spec.template.metadata.annotations.reloader\.stakater\.com/last-reloaded-from}'
        - {{ $timeout | quote }}
      securityContext: *containerSecurityContext
    - name: wait-reloaded-rollout
      image: {{ $kubectl }}
      command: ["kubectl", "rollout", "status", "deployment/{{ $annotated }}", "--namespace={{ .Release.Namespace }}", {{ $timeout | quote }}]
      securityContext: *containerSecurityContext
  containers:
    # Reloader handles every workload for one Secret event in a single pass,
    # so by now the unannotated Deployment would already have been patched.
    - name: assert-unannotated-untouched
      image: {{ $kubectl }}
      command: ["kubectl", "wait", "deployment/{{ $unannotated }}", "--namespace={{ .Release.Namespace }}", "--for=jsonpath={.metadata.generation}=1", "--timeout=5s"]
      securityContext: *containerSecurityContext
