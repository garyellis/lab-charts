apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: dynamodb-local
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: dynamodb-local
    namespaceTemplate: "lab-${env}"
    environments:
      dev:
        namespace: aws-dev
        values:
          - values.yaml
          - values-dev.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":     [dev, ci]
      "values-dev.yaml": [dev]
      "values-ci.yaml":  [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install DynamoDB Local with the Istio VirtualService CRD available and verify list-tables through the in-cluster service.
        namespace: aws-dev
        requires:
          - chart: istio-base
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        checks:
          - name: dynamodb-list-tables
            type: helm-test
            description: Run aws dynamodb list-tables against the in-cluster service endpoint.
        timeout: 10m

      routed:
        description: Install DynamoDB Local behind the shared apps gateway so it is callable through its VirtualService host.
        namespace: aws-dev
        requires:
          - chart: istio-gateway
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        checks:
          - name: dynamodb-list-tables
            type: helm-test
            description: Run aws dynamodb list-tables against the in-cluster service endpoint.
        timeout: 15m

    dependentTests: []
