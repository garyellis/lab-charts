apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: arc-runner-set
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: arc-runner-set
    environments:
      ci:
        namespace: arc-runners
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":     [ci]
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
    unmatchedChanges: all-environments

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install the ARC runner scale set using an existing GitHub auth Secret.
        namespace: arc-runners
        requires:
          - chart: arc
            profile: minimal
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: false
        timeout: 10m

      kind-runtime:
        description: Install a one-runner kind smoke profile that expects a real GitHub auth secret.
        namespace: arc-runners
        requires:
          - chart: arc
            profile: minimal
        values:
          - values.yaml
          - values-kind-runtime.yaml
        helmTest: true
        timeout: 15m

    dependentTests: []
