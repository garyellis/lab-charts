{{- /*
Render one ConfigMap per JSON dashboard in the explicitly selected groups.
The group is part of the resource identity and the path hash survives
truncation, so equal basenames and long names cannot collide silently.
*/ -}}
{{- $groups := required "enabledGroups is required and must select at least one dashboard group" .Values.enabledGroups -}}
{{- if eq (len $groups) 0 -}}
  {{- fail "enabledGroups must select at least one dashboard group" -}}
{{- end -}}
{{- $available := list "ai1-openstack" "networking" "obs-w-alerting" "platform" "slo" -}}
{{- range $group := $groups -}}
  {{- if not (has $group $available) -}}
    {{- fail (printf "enabledGroups contains unknown dashboard group %q" $group) -}}
  {{- end -}}
  {{- $matches := $.Files.Glob (printf "dashboards/%s/*.json" $group) -}}
  {{- if eq (len $matches) 0 -}}
    {{- fail (printf "enabled dashboard group %q contains no dashboards" $group) -}}
  {{- end -}}
  {{- range $path, $_ := $matches -}}
    {{- $document := $.Files.Get $path -}}
    {{- if gt (len $document) 921600 -}}
      {{- fail (printf "%s exceeds the 900 KiB dashboard ConfigMap safety limit" $path) -}}
    {{- end -}}
    {{- $parsed := mustFromJson $document -}}
    {{- if not $parsed.uid -}}
      {{- fail (printf "%s has no dashboard uid" $path) -}}
    {{- end -}}
    {{- $base := base $path | trimSuffix ".json" -}}
    {{- $identity := printf "%s-%s" $group $base -}}
    {{- $name := printf "grafana-dashboard-%s-%s" ($identity | trunc 35 | trimSuffix "-") (sha256sum $identity | trunc 8) -}}
    {{- $folder := $group | title -}}
    {{- if eq $group "slo" -}}
      {{- $folder = "SLO" -}}
    {{- else if eq $group "ai1-openstack" -}}
      {{- $folder = "OpenStack · ai1" -}}
    {{- else if eq $group "obs-w-alerting" -}}
      {{- $folder = "Observability · Alerting" -}}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    {{- with $.Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    grafana_folder: {{ $folder | quote }}
    meta.helm.sh/release-name: {{ $.Release.Name }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
data:
  {{ base $path }}: |-
{{ $document | indent 4 }}
  {{- end -}}
{{- end -}}
