apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: external-secrets
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: external-secrets
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        namespace: external-secrets
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":     [ci]
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
      "templates/**":   [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install External Secrets Operator with bundled CRDs and verify the control-plane deployments and CRDs are available.
        namespace: external-secrets
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests: []
