apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.indexer.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.componentLabels" (dict "root" . "component" "indexer") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wazuh.componentSelectorLabels" (dict "root" . "component" "indexer") | nindent 4 }}
  ports:
    - name: https
      port: 9200
      targetPort: https
      appProtocol: https
---
# Headless peer-discovery Service. Unready addresses are published so nodes
# can find each other before the cluster has formed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.indexer.nodesService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.componentLabels" (dict "root" . "component" "indexer") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "wazuh.componentSelectorLabels" (dict "root" . "component" "indexer") | nindent 4 }}
  ports:
    - name: transport
      port: 9300
      targetPort: transport
