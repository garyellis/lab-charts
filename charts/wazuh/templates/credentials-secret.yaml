{{- /*
CI/kind only. Real environments supply credentials.existingSecret (for
example from ExternalSecrets). No value is generated or defaulted here: every
key is required, so an incomplete opt-in fails rendering.
*/ -}}
{{- if .Values.credentials.create }}
{{- $v := .Values.credentials.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.credentialsSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
stringData:
  indexer-admin-password: {{ required "credentials.values.indexerAdminPassword is required when credentials.create=true" $v.indexerAdminPassword | quote }}
  indexer-dashboard-password: {{ required "credentials.values.indexerDashboardPassword is required when credentials.create=true" $v.indexerDashboardPassword | quote }}
  indexer-writer-password: {{ required "credentials.values.indexerWriterPassword is required when credentials.create=true" $v.indexerWriterPassword | quote }}
  dashboard-cookie-password: {{ required "credentials.values.dashboardCookiePassword is required when credentials.create=true" $v.dashboardCookiePassword | quote }}
  api-password: {{ required "credentials.values.apiPassword is required when credentials.create=true" $v.apiPassword | quote }}
  authd-password: {{ required "credentials.values.authdPassword is required when credentials.create=true" $v.authdPassword | quote }}
  cluster-key: {{ required "credentials.values.clusterKey is required when credentials.create=true" $v.clusterKey | quote }}
{{- else }}
{{- /* Fail fast when no credentials source is configured. */ -}}
{{- $_ := include "wazuh.credentialsSecret" . }}
{{- end }}
