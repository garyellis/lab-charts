version: 1
enabled: true

manifestValidation:
  enabled: true
  releaseName: strimzi-kafka-operator
  namespaceTemplate: "lab-${env}"
  environments:
    ci:
      namespace: strimzi-kafka-operator
      values:
        - values.yaml
        - values-ci.yaml
  triggers:
    "Chart.yaml":     [ci]
    "values.yaml":    [ci]
    "values-ci.yaml": [ci]
    "templates/**":   [ci]
  unmatchedChanges: warn

clusterTests:
  enabled: true
  profiles:
    minimal:
      description: Install Strimzi Kafka Operator with a single-node Kafka cluster and verify both become ready.
      namespace: strimzi-kafka-operator
      requires: []
      values:
        - values.yaml
        - values-ci.yaml
      helmTest: true
      checks:
        - name: control-plane-ready
          type: helm-test
          description: Wait for the Strimzi cluster operator deployment to become available.
        - name: crds-installed
          type: helm-test
          description: Verify the Strimzi Kafka and StrimziPodSet CRDs exist.
        - name: kafka-ready
          type: helm-test
          description: Wait for the lab Kafka cluster to report Ready.
      timeout: 10m

  dependentTests: []
