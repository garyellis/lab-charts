apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: strimzi-kafka-operator
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: strimzi-kafka-operator
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        namespace: strimzi-kafka-operator
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":     [ci]
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
      "templates/**":   [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Strimzi Kafka Operator with a single-node Kafka cluster and verify both become ready.
        namespace: strimzi-kafka-operator
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests: []
