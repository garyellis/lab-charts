apiVersion: lifecycle.cmg.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: inspektor-gadget
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: inspektor-gadget
    namespaceTemplate: "lab-${env}"
    environments:
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "values.yaml":    [ci]
      "values-ci.yaml": [ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Inspektor Gadget DaemonSet and verify it rolls out on every node.
        namespace: gadget
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests: []
