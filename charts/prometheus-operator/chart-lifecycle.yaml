apiVersion: lifecycle.chartmanager.io/v1alpha1
kind: ChartLifecycle
metadata:
  name: prometheus-operator
spec:
  enabled: true
  validation:
    enabled: true
    releaseName: prometheus-operator
    namespaceTemplate: "lab-${env}"
    environments:
      dev:
        values:
          - values.yaml
          - values-dev.yaml
      test:
        values:
          - values.yaml
          - values-test.yaml
      uat:
        values:
          - values.yaml
          - values-uat.yaml
      prod:
        values:
          - values.yaml
          - values-prod.yaml
      ci:
        values:
          - values.yaml
          - values-ci.yaml
    triggers:
      "Chart.yaml":       [dev, test, uat, prod, ci]
      "values.yaml":      [dev, test, uat, prod, ci]
      "values-dev.yaml":  [dev]
      "values-test.yaml": [test]
      "values-uat.yaml":  [uat]
      "values-prod.yaml": [prod]
      "values-ci.yaml":   [ci]
      "templates/**":     [dev, test, uat, prod, ci]
      "chart-lifecycle.yaml": [dev, test, uat, prod, ci]
    unmatchedChanges: warn

  clusterTest:
    enabled: true
    profiles:
      minimal:
        description: Install Prometheus Operator CRDs and operator only.
        requires: []
        values:
          - values.yaml
          - values-ci.yaml
        helmTest: true
        timeout: 10m

    dependentTests:
      - chart: kube-state-metrics
        profile: minimal
      - chart: node-exporter
        profile: minimal
      - chart: alloy
        profile: minimal
