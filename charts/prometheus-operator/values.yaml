# helm/values/prometheus-operator.yaml
# Prometheus Operator - CRDs and Operator Only
# ============================================================================
# Deploys ONLY the operator and CRDs for ServiceMonitor, PodMonitor, etc.
# Does NOT deploy Prometheus, Alertmanager, or Grafana.
#
# Why: Thanos is the central metrics backend. The operator and its CRDs are
# installed first so component charts can ship their intended monitoring
# definitions before collection and rule evaluation are enabled.
#
# Subchart values must nest under `prometheus-operator:` because Chart.yaml
# aliases the kube-prometheus-stack dependency to that name.

prometheus-operator:
  crds:
    enabled: true

  # The upstream rules describe a full kube-prometheus-stack installation.
  # This wrapper installs only the operator, so those rules have no matching
  # workloads. Component-owned rules remain allowed.
  defaultRules:
    create: false

  prometheus:
    enabled: false

  alertmanager:
    enabled: false

  grafana:
    enabled: false

  thanosRuler:
    enabled: false

  # Disable exporters (we don't need them without Prometheus).
  # Note: nodeExporter.enabled is the subchart condition key, not
  # prometheus-node-exporter.enabled.
  nodeExporter:
    enabled: false

  windowsMonitoring:
    enabled: false

  kubeStateMetrics:
    enabled: false

  # Keep the operator and admission webhook. The operator validates monitoring
  # resources; collectors and rule evaluators are deployed in later phases.
  prometheusOperator:
    enabled: true

    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # Kubernetes control-plane monitoring is outside this wrapper's scope.
  kubernetesServiceMonitors:
    enabled: false

  kubeApiServer:
    enabled: false

  kubelet:
    enabled: false

  kubeControllerManager:
    enabled: false

  coreDns:
    enabled: false

  kubeDns:
    enabled: false

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

# Hand-rolled ServiceMonitors for charts that own resources whose CRDs
# this chart provides. They live here (not in the source chart) so the
# source chart can install before prometheus-operator without failing
# on a missing ServiceMonitor CRD. Selectors/ports mirror the upstream
# cilium 1.18.5 chart's own ServiceMonitor templates.
serviceMonitors:
  cilium:
    enabled: true
    namespace: kube-system
    interval: 30s
    # Future Alloy discovery selects this label.
    labels:
      release: alloy
  # istiod control-plane metrics (istio_build, pilot_*). The Envoy data plane
  # (istio_requests_total, which draws the Kiali graph) is scraped separately
  # via each sidecar's prometheus.io/scrape annotation, so it is intentionally
  # not covered here.
  istio:
    enabled: true
    namespace: istio-system
    interval: 30s
    labels:
      release: alloy
