---
appsDomain: kind.local

persistence:
  enabled: false
  storageClassName: ""
  size: 1Gi

emulator:
  explorer:
    enabled: false

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

startupProbe:
  # First-time database initialization can exceed ten minutes on a contended
  # GitHub-hosted runner. Keep the original process alive for up to 20 minutes;
  # restarting it interrupts initialization and repeats the slow path.
  failureThreshold: 240
