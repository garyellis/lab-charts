{{/* Render exact expected alerts without reusing the production label helper. */}}
{{- define "observability-alerting.promtoolExpectedAlert" -}}
- exp_labels:
    alertname: {{ .alertname | quote }}
    severity: {{ .severity | quote }}
    owner: {{ .root.Values.alerts.owner | quote }}
    service: {{ .service | quote }}
    component: {{ .component | quote }}
    scope: {{ .scope | quote }}
    alert_family: {{ .family | quote }}
    incident_key: {{ .incidentKey | quote }}
    {{- if eq .scope "obs-w" }}
    cluster: {{ .root.Values.identity.hub.cluster | quote }}
    {{- else if eq .scope "ai1" }}
    infra: {{ .root.Values.identity.ai1.infra | quote }}
    {{- end }}
    {{- range $key, $value := .extraLabels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  exp_annotations:
    summary: {{ .summary | quote }}
    description: {{ .description | quote }}
    impact: {{ .impact | quote }}
    runbook_url: {{ include "observability-alerting.runbook" (dict "root" .root "slug" .runbook) | quote }}
    dashboard_url: {{ include "observability-alerting.dashboard" (dict "root" .root "slug" .dashboard) | quote }}
{{- end -}}

{{- define "observability-alerting.promtoolLifecycle" -}}
- eval_time: 1m
  alertname: {{ .alertname }}
  exp_alerts: []
- eval_time: 14m
  alertname: {{ .alertname }}
  exp_alerts: []
- eval_time: 40m
  alertname: {{ .alertname }}
  exp_alerts:
{{ .expected | indent 4 }}
- eval_time: 60m
  alertname: {{ .alertname }}
  exp_alerts: []
{{ end -}}

{{- define "observability-alerting.promtoolHealthy" -}}
- eval_time: 20m
  alertname: {{ . }}
  exp_alerts: []
{{ end -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-alerting.fullname" . }}-promtool
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-alerting.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  rules.yaml: |
    groups:
{{ include "observability-alerting.ruleGroups" . | replace "      partial_response_strategy: abort\n" "" | indent 4 }}
  tests.yaml: |
    rule_files:
      - /rules/rules.yaml
    evaluation_interval: 1m
    tests:
      - name: complete portfolio remains healthy
        interval: 1m
        input_series:
          {{- range $.Values.telemetry.expectedHubTargets }}
          - series: 'up{cluster={{ $.Values.identity.hub.cluster | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x50'
          {{- end }}
          {{- range $.Values.telemetry.expectedAi1Targets }}
          - series: 'up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x50'
          {{- end }}
          - series: 'prometheus_remote_storage_samples_failed_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0x50'
          - series: 'prometheus_remote_storage_samples_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0x50'
          - series: 'prometheus_remote_write_wal_out_of_order_samples_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0x50'
          - series: 'prometheus_remote_storage_queue_highest_sent_timestamp_seconds{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0+60x50'
          {{- range .Values.openstack.expectedFamilies }}
          - series: 'openstack_{{ . }}_up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }}}'
            values: '1x50'
          {{- end }}
          - series: 'libvirt_up{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.libvirt.job | quote }}}'
            values: '1x50'
          - series: 'libvirt_domain_openstack_info{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '1x50'
          - series: 'openstack_telemetry_cinder_scrape_error{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '0x50'
          - series: 'openstack_telemetry_cinder_last_success_unixtime{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '0+60x50'
          - series: 'cinder_thin_pool_data_percent{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '0x50'
          - series: 'cinder_thin_pool_metadata_percent{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '0x50'
          - series: 'up{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.hostSaturation.nodeExporterJob | quote }}}'
            values: '1x50'
          {{- range $kind, $_ := .Values.hostSaturation.pressurePercent }}
          - series: 'node_pressure_{{ $kind }}_waiting_seconds_total{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }}}'
            values: '0x50'
          {{- end }}
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.thanosCompactor.job | quote }}}'
            values: '1x50'
          - series: 'thanos_compact_halted{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.thanosCompactor.job | quote }}}'
            values: '0x50'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '1x50'
          - series: 'prometheus_rule_evaluation_failures_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'thanos_rule_evaluation_with_warnings_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'thanos_alert_sender_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'thanos_alert_queue_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'prometheus_rule_group_last_duration_seconds{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'prometheus_rule_group_last_evaluation_timestamp_seconds{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0+60x50'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '1x50'
          - series: 'alertmanager_config_last_reload_successful{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '1x50'
          - series: 'alertmanager_notifications_failed_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '0x50'
        alert_rule_test:
          {{- $alertNames := list "TelemetryTargetMissingOrStale" "RemoteWriteSamplesFailed" "RemoteWriteSamplesDropped" "RemoteWriteMetricFamilyMissing" "RemoteWriteLagging" "OpenStackCollectorFamilyMissing" "OpenStackCollectorFamilyFailing" "LibvirtInventoryUnexpectedlyEmpty" "CinderCollectorFailing" "CinderCollectorStale" "CinderThinPoolDataCapacityLow" "CinderThinPoolDataExhaustionImminent" "CinderThinPoolMetadataCapacityLow" "CinderThinPoolMetadataExhaustionImminent" "ThanosCompactorHalted" "ThanosCompactorMissing" "ThanosCompactorMetricFamilyMissing" "ThanosRulerMissing" "ThanosRulerMetricFamilyMissing" "ThanosRulerEvaluationFailures" "ThanosRulerEvaluationWarnings" "ThanosRulerAlertDeliveryFailures" "ThanosRulerEvaluationTooSlow" "AlertmanagerMissing" "AlertmanagerMetricFamilyMissing" "AlertmanagerConfigReloadFailed" "AlertmanagerNotificationFailures" -}}
          {{- range $kind, $_ := .Values.hostSaturation.pressurePercent }}
          {{- $alertNames = append $alertNames (printf "Host%sPressureHigh" (title $kind)) -}}
          {{- $alertNames = append $alertNames (printf "Host%sPressureMetricMissing" (title $kind)) -}}
          {{- end }}
{{- range $alertName := $alertNames }}
{{ include "observability-alerting.promtoolHealthy" $alertName | indent 10 }}
{{- end }}

      {{- range $selected := .Values.telemetry.expectedHubTargets }}
      - name: hub target {{ $selected.name }} isolates pending firing and recovery
        interval: 1m
        input_series:
          {{- range $.Values.telemetry.expectedHubTargets }}
          - series: 'up{cluster={{ $.Values.identity.hub.cluster | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: {{ ternary "_x3 1x12 _x25 1x20" "1x65" (eq .name $selected.name) | quote }}
          {{- end }}
          {{- range $.Values.telemetry.expectedAi1Targets }}
          - series: 'up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x65'
          {{- end }}
        alert_rule_test:
          {{ $expected := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "TelemetryTargetMissingOrStale" "severity" "critical" "service" "telemetry" "component" $selected.component "scope" "obs-w" "family" "telemetry" "incidentKey" (printf "telemetry-target-%s" $selected.name) "extraLabels" (dict "expected_target" $selected.name "telemetry_source" "hub") "summary" (printf "Telemetry target %s is missing, down, or stale" $selected.name) "description" "The exact expected scrape target is not producing a fresh successful sample." "impact" "Alerts and dashboards depending on this producer may be incomplete; missing data must not be interpreted as a healthy zero." "runbook" "telemetry-path-stale" "dashboard" "obs-w-alerting-health") }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "TelemetryTargetMissingOrStale" "expected" $expected) | indent 10 }}
      {{- end }}

      {{- if gt (len .Values.telemetry.expectedHubTargets) 0 }}
      {{- $branchTarget := index .Values.telemetry.expectedHubTargets 0 }}
      - name: hub target up zero branch fires and recovers
        interval: 1m
        input_series:
          {{- range .Values.telemetry.expectedHubTargets }}
          - series: 'up{cluster={{ $.Values.identity.hub.cluster | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: {{ ternary "0x3 1x12 0x25 1x20" "1x65" (eq .name $branchTarget.name) | quote }}
          {{- end }}
          {{- range .Values.telemetry.expectedAi1Targets }}
          - series: 'up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x65'
          {{- end }}
        alert_rule_test:
          {{ $downExpected := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "TelemetryTargetMissingOrStale" "severity" "critical" "service" "telemetry" "component" $branchTarget.component "scope" "obs-w" "family" "telemetry" "incidentKey" (printf "telemetry-target-%s" $branchTarget.name) "extraLabels" (dict "expected_target" $branchTarget.name "telemetry_source" "hub") "summary" (printf "Telemetry target %s is missing, down, or stale" $branchTarget.name) "description" "The exact expected scrape target is not producing a fresh successful sample." "impact" "Alerts and dashboards depending on this producer may be incomplete; missing data must not be interpreted as a healthy zero." "runbook" "telemetry-path-stale" "dashboard" "obs-w-alerting-health") }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "TelemetryTargetMissingOrStale" "expected" $downExpected) | indent 10 }}

      - name: hub target stale timestamp branch fires and recovers
        interval: 1m
        input_series:
          {{- range .Values.telemetry.expectedHubTargets }}
          - series: 'up{cluster={{ $.Values.identity.hub.cluster | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: {{ ternary "1 _x14 1x20" "1x35" (eq .name $branchTarget.name) | quote }}
          {{- end }}
          {{- range .Values.telemetry.expectedAi1Targets }}
          - series: 'up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x35'
          {{- end }}
        promql_expr_test:
          - expr: 'sum((time() - timestamp(up{tenant_id={{ .Values.identity.tenantId | quote }},cluster={{ .Values.identity.hub.cluster | quote }},job={{ $branchTarget.job | quote }},instance={{ $branchTarget.instance | quote }}})) > bool {{ .Values.telemetry.staleAfterSeconds }})'
            eval_time: 3m
            exp_samples:
              - labels: '{}'
                value: 1
        alert_rule_test:
          - eval_time: 1m
            alertname: TelemetryTargetMissingOrStale
            exp_alerts: []
          - eval_time: 13m
            alertname: TelemetryTargetMissingOrStale
            exp_alerts:
          {{ $staleExpected := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "TelemetryTargetMissingOrStale" "severity" "critical" "service" "telemetry" "component" $branchTarget.component "scope" "obs-w" "family" "telemetry" "incidentKey" (printf "telemetry-target-%s" $branchTarget.name) "extraLabels" (dict "expected_target" $branchTarget.name "telemetry_source" "hub") "summary" (printf "Telemetry target %s is missing, down, or stale" $branchTarget.name) "description" "The exact expected scrape target is not producing a fresh successful sample." "impact" "Alerts and dashboards depending on this producer may be incomplete; missing data must not be interpreted as a healthy zero." "runbook" "telemetry-path-stale" "dashboard" "obs-w-alerting-health") }}
{{ $staleExpected | indent 14 }}
          - eval_time: 20m
            alertname: TelemetryTargetMissingOrStale
            exp_alerts: []
      {{- end }}

      - name: primary signals cover pending firing overlap and recovery
        interval: 1m
        input_series:
          {{- range .Values.telemetry.expectedHubTargets }}
          - series: 'up{cluster={{ $.Values.identity.hub.cluster | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x50'
          {{- end }}
          {{- range .Values.telemetry.expectedAi1Targets }}
          - series: 'up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x50'
          {{- end }}
          - series: 'prometheus_remote_storage_samples_failed_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
          - series: 'prometheus_remote_storage_samples_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
          - series: 'prometheus_remote_write_wal_out_of_order_samples_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0x50'
          - series: 'prometheus_remote_storage_queue_highest_sent_timestamp_seconds{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '-1000x3 180+60x12 -1000x25 2580+60x20'
          {{- range .Values.openstack.expectedFamilies }}
          - series: 'openstack_{{ . }}_up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }}}'
            values: '0x3 1x12 0x25 1x20'
          {{- end }}
          - series: 'libvirt_up{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.libvirt.job | quote }}}'
            values: '1x50'
          - series: 'libvirt_domain_openstack_info{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '_x3 1x12 _x25 1x20'
          - series: 'openstack_telemetry_cinder_scrape_error{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '1x3 0x12 1x25 0x20'
          - series: 'openstack_telemetry_cinder_last_success_unixtime{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '-1000x3 180+60x12 -1000x25 2580+60x20'
          - series: 'cinder_thin_pool_data_percent{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '95x3 0x12 95x25 0x20'
          - series: 'cinder_thin_pool_metadata_percent{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }}}'
            values: '95x3 0x12 95x25 0x20'
          - series: 'up{infra={{ .Values.identity.ai1.infra | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.hostSaturation.nodeExporterJob | quote }}}'
            values: '1x50'
          {{- range $kind, $_ := .Values.hostSaturation.pressurePercent }}
          - series: 'node_pressure_{{ $kind }}_waiting_seconds_total{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }}}'
            values: '0+60x3 180x12 180+60x25 1680x20'
          {{- end }}
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.thanosCompactor.job | quote }}}'
            values: '1x50'
          - series: 'thanos_compact_halted{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.thanosCompactor.job | quote }}}'
            values: '1x3 0x12 1x25 0x20'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '1x50'
          - series: 'prometheus_rule_evaluation_failures_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
          - series: 'thanos_rule_evaluation_with_warnings_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
          - series: 'thanos_alert_sender_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
          - series: 'thanos_alert_queue_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'prometheus_rule_group_last_duration_seconds{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '60x3 0x12 60x25 0x20'
          - series: 'prometheus_rule_group_last_evaluation_timestamp_seconds{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0+60x50'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '1x50'
          - series: 'alertmanager_config_last_reload_successful{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '0x3 1x12 0x25 1x20'
          - series: 'alertmanager_notifications_failed_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
        alert_rule_test:
{{ $primaryCases := list }}
          {{- $primaryCases = append $primaryCases (dict "alertname" "RemoteWriteSamplesFailed" "severity" "critical" "service" "telemetry" "component" "remote-write" "scope" "obs-w" "family" "remote-write" "incidentKey" "remote-write-failed" "extraLabels" (dict) "summary" "Remote write is failing samples" "description" "The remote-write client reported failed samples during the observation window." "impact" "Telemetry may be delayed or lost, weakening detection and diagnosis." "runbook" "remote-write-failure" "dashboard" "obs-w-alerting-health") -}}
          {{- $primaryCases = append $primaryCases (dict "alertname" "RemoteWriteSamplesDropped" "severity" "critical" "service" "telemetry" "component" "remote-write" "scope" "obs-w" "family" "remote-write" "incidentKey" "remote-write-dropped" "extraLabels" (dict) "summary" "Remote write is dropping samples" "description" "The remote-write client reported discarded samples during the observation window." "impact" "Telemetry has been lost and historical queries may contain permanent gaps." "runbook" "remote-write-failure" "dashboard" "obs-w-alerting-health") -}}
          {{- $primaryCases = append $primaryCases (dict "alertname" "RemoteWriteLagging" "severity" "warning" "service" "telemetry" "component" "remote-write" "scope" "obs-w" "family" "remote-write" "incidentKey" "remote-write-lag" "extraLabels" (dict) "summary" "Remote write is behind ingestion" "description" "The newest successfully sent sample is older than the configured lag budget." "impact" "Detection and dashboard data are delayed even if samples eventually arrive." "runbook" "remote-write-failure" "dashboard" "obs-w-alerting-health") -}}
          {{- $primaryCases = append $primaryCases (dict "alertname" "LibvirtInventoryUnexpectedlyEmpty" "severity" "critical" "service" "openstack" "component" "libvirt-exporter" "scope" "ai1" "family" "libvirt" "incidentKey" "libvirt-inventory" "extraLabels" (dict) "summary" "Libvirt inventory is unexpectedly empty" "description" "The libvirt exporter is healthy but no OpenStack-correlated domains are present." "impact" "Guest-level visibility is absent and inventory reconciliation may be broken." "runbook" "libvirt-inventory-empty" "dashboard" "ai1-libvirt-hypervisor") -}}
