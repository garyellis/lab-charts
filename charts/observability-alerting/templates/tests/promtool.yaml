  (dict "name" "thanos_rule_evaluation_with_warnings_total" "incidentKey" "ruler-metric-evaluation-warnings")
  (dict "name" "thanos_alert_queue_alerts_dropped_total" "incidentKey" "ruler-metric-alert-queue-drops")
  (dict "name" "thanos_alert_sender_alerts_dropped_total" "incidentKey" "ruler-metric-alert-sender-drops")
  (dict "name" "prometheus_rule_group_last_duration_seconds" "incidentKey" "ruler-metric-evaluation-duration")
  (dict "name" "prometheus_rule_group_last_evaluation_timestamp_seconds" "incidentKey" "ruler-metric-last-evaluation")
}}
{{ range $metric := $rulerMetricCases }}
{{ $one := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "ThanosRulerMetricFamilyMissing" "severity" "critical" "service" "alerting" "component" "thanos-ruler" "scope" "obs-w" "family" "alerting" "incidentKey" $metric.incidentKey "extraLabels" (dict "metric_family" $metric.name) "summary" (printf "Thanos Ruler metric family %s is missing" $metric.name) "description" "The Ruler scrape target is healthy but a required evaluation or delivery metric family is absent." "impact" "Ruler failures may be hidden; missing telemetry must not be interpreted as a healthy zero." "runbook" "alerting-pipeline" "dashboard" "obs-w-alerting-health") }}
{{ $rulerMetricExpected = printf "%s%s\n" $rulerMetricExpected $one }}
{{ end }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "ThanosRulerMetricFamilyMissing" "expected" $rulerMetricExpected) | indent 10 }}
          {{ $alertmanagerMetricExpected := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "AlertmanagerMetricFamilyMissing" "severity" "critical" "service" "alerting" "component" "alertmanager" "scope" "obs-w" "family" "alerting" "incidentKey" "alertmanager-metric-config-reload" "extraLabels" (dict "metric_family" "alertmanager_config_last_reload_successful") "summary" "Alertmanager config-reload metric family is missing" "description" "The Alertmanager scrape target is healthy but its required config-reload metric family is absent." "impact" "A rejected or stale routing configuration may be hidden; missing telemetry must not be interpreted as a healthy zero." "runbook" "alerting-pipeline" "dashboard" "obs-w-alerting-health") }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "AlertmanagerMetricFamilyMissing" "expected" $alertmanagerMetricExpected) | indent 10 }}

      - name: required metric-family alerts defer to component-down alerts
        interval: 1m
        input_series:
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0x30'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.thanosCompactor.job | quote }}}'
            values: '0x30'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x30'
          - series: 'up{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '0x30'
        alert_rule_test:
          {{- range $alertName := list "RemoteWriteMetricFamilyMissing" "ThanosCompactorMetricFamilyMissing" "ThanosRulerMetricFamilyMissing" "AlertmanagerMetricFamilyMissing" }}
          - eval_time: 20m
            alertname: {{ $alertName }}
            exp_alerts: []
          {{- end }}

      - name: counter resets do not manufacture failures
        interval: 1m
        input_series:
          - series: 'prometheus_remote_storage_samples_failed_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '10x10 0x35'
          - series: 'prometheus_remote_storage_samples_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '10x10 0x35'
          - series: 'prometheus_remote_write_wal_out_of_order_samples_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '10x10 0x35'
          - series: 'prometheus_rule_evaluation_failures_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '10x10 0x35'
          - series: 'thanos_rule_evaluation_with_warnings_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '10x10 0x35'
          - series: 'thanos_alert_sender_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '10x10 0x35'
          - series: 'thanos_alert_queue_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '10x10 0x35'
          - series: 'alertmanager_notifications_failed_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.alertmanagerJob | quote }}}'
            values: '10x10 0x35'
        alert_rule_test:
          {{- range $alertName := list "RemoteWriteSamplesFailed" "RemoteWriteSamplesDropped" "ThanosRulerEvaluationFailures" "ThanosRulerEvaluationWarnings" "ThanosRulerAlertDeliveryFailures" "AlertmanagerNotificationFailures" }}
          - eval_time: 30m
            alertname: {{ $alertName }}
            exp_alerts: []
          {{- end }}

      - name: alternate drop counters preserve lifecycle coverage
        interval: 1m
        input_series:
          - series: 'prometheus_remote_storage_samples_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0x50'
          - series: 'prometheus_remote_write_wal_out_of_order_samples_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.telemetry.remoteWrite.job | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
          - series: 'thanos_alert_sender_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0x50'
          - series: 'thanos_alert_queue_alerts_dropped_total{cluster={{ .Values.identity.hub.cluster | quote }},tenant_id={{ .Values.identity.tenantId | quote }},job={{ .Values.monitoring.rulerJob | quote }}}'
            values: '0+1x3 3x12 3+1x25 28x20'
        alert_rule_test:
          {{ $dropped := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "RemoteWriteSamplesDropped" "severity" "critical" "service" "telemetry" "component" "remote-write" "scope" "obs-w" "family" "remote-write" "incidentKey" "remote-write-dropped" "extraLabels" (dict) "summary" "Remote write is dropping samples" "description" "The remote-write client reported discarded samples during the observation window." "impact" "Telemetry has been lost and historical queries may contain permanent gaps." "runbook" "remote-write-failure" "dashboard" "obs-w-alerting-health") }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "RemoteWriteSamplesDropped" "expected" $dropped) | indent 10 }}
          {{ $delivery := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "ThanosRulerAlertDeliveryFailures" "severity" "critical" "service" "alerting" "component" "thanos-ruler" "scope" "obs-w" "family" "alerting" "incidentKey" "ruler-alert-delivery" "extraLabels" (dict) "summary" "Thanos Ruler is dropping alerts before Alertmanager" "description" "The Ruler alert queue or sender dropped alerts during the observation window." "impact" "Correctly evaluated alerts may never reach Alertmanager for routing and delivery." "runbook" "alerting-pipeline" "dashboard" "obs-w-alerting-health") }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "ThanosRulerAlertDeliveryFailures" "expected" $delivery) | indent 10 }}

      {{- range $selected := .Values.telemetry.expectedAi1Targets }}
      - name: ai1 target {{ $selected.name }} isolates pending firing and recovery
        interval: 1m
        input_series:
          {{- range $.Values.telemetry.expectedHubTargets }}
          - series: 'up{cluster={{ $.Values.identity.hub.cluster | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: '1x65'
          {{- end }}
          {{- range $.Values.telemetry.expectedAi1Targets }}
          - series: 'up{infra={{ $.Values.identity.ai1.infra | quote }},tenant_id={{ $.Values.identity.tenantId | quote }},job={{ .job | quote }},instance={{ .instance | quote }}}'
            values: {{ ternary "_x3 1x12 _x25 1x20" "1x65" (eq .name $selected.name) | quote }}
          {{- end }}
        alert_rule_test:
          {{ $expected := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "TelemetryTargetMissingOrStale" "severity" "critical" "service" "telemetry" "component" $selected.component "scope" "ai1" "family" "telemetry" "incidentKey" (printf "telemetry-target-%s" $selected.name) "extraLabels" (dict "expected_target" $selected.name "telemetry_source" "ai1") "summary" (printf "Telemetry target %s is missing, down, or stale" $selected.name) "description" "The exact expected scrape target is not producing a fresh successful sample." "impact" "Alerts and dashboards depending on this producer may be incomplete; missing data must not be interpreted as a healthy zero." "runbook" "telemetry-path-stale" "dashboard" "ai1-telemetry-integrity") }}
{{ include "observability-alerting.promtoolLifecycle" (dict "alertname" "TelemetryTargetMissingOrStale" "expected" $expected) | indent 10 }}
      {{- end }}

      {{- if .Values.alerts.watchdog.enabled }}
{{ $watchdogExpected := include "observability-alerting.promtoolExpectedAlert" (dict "root" $ "alertname" "Watchdog" "severity" "info" "service" "alerting" "component" "alerting" "scope" "obs-w" "family" "alerting" "incidentKey" "watchdog" "extraLabels" (dict) "summary" "Alerting pipeline watchdog" "description" "This alert is intentionally always firing for an independent dead-man receiver." "impact" "Absence at the independent receiver indicates a failure somewhere in evaluation, routing, or delivery." "runbook" "alerting-pipeline" "dashboard" "obs-w-alerting-health") }}
      - name: watchdog becomes continuously firing after its pending interval
        interval: 1m
        alert_rule_test:
          - eval_time: 0m
            alertname: Watchdog
            exp_alerts: []
          - eval_time: 2m
            alertname: Watchdog
            exp_alerts:
{{ $watchdogExpected | indent 14 }}
      {{- end }}

---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "observability-alerting.fullname" . }}-promtool
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-alerting.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: promtool
      image: "{{ .Values.tests.promtoolImage.repository }}:{{ .Values.tests.promtoolImage.tag }}"
      imagePullPolicy: IfNotPresent
      command: [/bin/promtool]
      args: [test, rules, /tests/tests.yaml]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: rules
          mountPath: /rules
        - name: tests
          mountPath: /tests
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: rules
      configMap:
        name: {{ include "observability-alerting.fullname" . }}-promtool
        items:
          - key: rules.yaml
            path: rules.yaml
    - name: tests
      configMap:
        name: {{ include "observability-alerting.fullname" . }}-promtool
        items:
          - key: tests.yaml
            path: tests.yaml
    - name: tmp
      emptyDir: {}
