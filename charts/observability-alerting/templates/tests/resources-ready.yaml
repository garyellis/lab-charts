{{- $testName := printf "%s-resources" (include "observability-alerting.fullname" .) | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [thanosrulers, alertmanagers, alertmanagerconfigs, prometheusrules, servicemonitors]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $testName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $testName }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $testName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ $testName }}
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ruler
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: IfNotPresent
      command: [kubectl]
      args:
        - rollout
        - status
        - --timeout=300s
        - statefulset/thanos-ruler-{{ include "observability-alerting.rulerName" . }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
    - name: alertmanager
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: IfNotPresent
      command: [kubectl]
      args:
        - rollout
        - status
        - --timeout=300s
        - statefulset/alertmanager-{{ include "observability-alerting.alertmanagerName" . }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
    - name: storeapi
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: IfNotPresent
      command: [kubectl]
      args:
        - wait
        - --for=jsonpath={.spec.ports[?(@.name=="grpc")].port}=10901
        - --timeout=300s
        - service/thanos-ruler-operated
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
    {{- if .Values.tests.queryFixture.enabled }}
    - name: alerting-path
      image: "{{ .Values.tests.promtoolImage.repository }}:{{ .Values.tests.promtoolImage.tag }}"
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -ec]
      args:
        - |
          fixture=http://{{ include "observability-alerting.queryFixtureName" . }}:9090
          remaining=75

          wait_for() {
            check_name="$1"
            expression="$2"
            output=""
            while [ "$remaining" -gt 0 ]; do
              output="$(/bin/promtool query instant "$fixture" "$expression" 2>&1 || true)"
              if printf '%s\n' "$output" | grep -Eq '=> 1([ @]|$)'; then
                printf 'PASS: %s\n' "$check_name"
                return 0
              fi
              remaining=$((remaining - 1))
              sleep 2
            done
            printf 'FAIL: %s exhausted the shared 150s deadline\nexpression: %s\nlast output:\n%s\n' \
              "$check_name" "$expression" "$output" >&2
            /bin/promtool query instant "$fixture" '{job=~"test-(thanos-ruler|alertmanager)"}' >&2 || true
            exit 1
          }

          wait_for "query fixture is ready" 'vector(1)'
          wait_for "Thanos Ruler target is up" \
            'max(up{job="test-thanos-ruler"}) == bool 1'
          wait_for "Alertmanager target is up" \
            'max(up{job="test-alertmanager"}) == bool 1'
          wait_for "Ruler last-evaluation metric family exists" \
            'count(prometheus_rule_group_last_evaluation_timestamp_seconds{job="test-thanos-ruler"}) > bool 0'
          wait_for "at least one rule group completed evaluation" \
            'max(prometheus_rule_group_last_evaluation_timestamp_seconds{job="test-thanos-ruler"}) > bool 0'
          wait_for "Ruler evaluation-failure metric family exists" \
            'count(prometheus_rule_evaluation_failures_total{job="test-thanos-ruler"}) > bool 0'
          wait_for "rule evaluations have no failures" \
            'sum(prometheus_rule_evaluation_failures_total{job="test-thanos-ruler"}) == bool 0'
          wait_for "Ruler evaluation-warning metric family exists" \
            'count(thanos_rule_evaluation_with_warnings_total{job="test-thanos-ruler"}) > bool 0'
          wait_for "rule evaluations have no warnings" \
            'sum(thanos_rule_evaluation_with_warnings_total{job="test-thanos-ruler"}) == bool 0'
          wait_for "Ruler alert-queue drop metric family exists" \
            'count(thanos_alert_queue_alerts_dropped_total{job="test-thanos-ruler"}) > bool 0'
          wait_for "Ruler alert queue has no drops" \
            'sum(thanos_alert_queue_alerts_dropped_total{job="test-thanos-ruler"}) == bool 0'
          wait_for "Ruler alert-sender drop metric family exists" \
            'count(thanos_alert_sender_alerts_dropped_total{job="test-thanos-ruler"}) > bool 0'
          wait_for "Ruler alert sender has no drops" \
            'sum(thanos_alert_sender_alerts_dropped_total{job="test-thanos-ruler"}) == bool 0'
          wait_for "Ruler evaluation-duration metric family exists" \
            'count(prometheus_rule_group_last_duration_seconds{job="test-thanos-ruler"}) > bool 0'
          wait_for "Ruler evaluation duration is within budget" \
            'max(prometheus_rule_group_last_duration_seconds{job="test-thanos-ruler"}) < bool {{ .Values.alertingHealth.maxEvaluationSeconds }}'
          wait_for "Alertmanager config-reload metric family exists" \
            'count(alertmanager_config_last_reload_successful{job="test-alertmanager"}) > bool 0'
          wait_for "Alertmanager accepted its generated configuration" \
            'min(alertmanager_config_last_reload_successful{job="test-alertmanager"}) == bool 1'
          wait_for "Alertmanager received the Watchdog from Thanos Ruler" \
            'sum(alertmanager_alerts_received_total{job="test-alertmanager"}) > bool 0'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    {{- end }}
