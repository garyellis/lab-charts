{{/* Fail before rendering resources when a cross-field invariant is invalid. */}}
{{- if and .Values.delivery.enabled (or (not .Values.delivery.webhook.secretName) (not .Values.delivery.webhook.secretKey)) -}}
{{- fail "delivery.webhook.secretName and secretKey are required when delivery.enabled=true" -}}
{{- end -}}
{{- if not (hasPrefix "v0.42." .Values.thanosRuler.version) -}}
{{- fail "thanosRuler.version must remain in the reviewed v0.42 release line" -}}
{{- end -}}
{{- if or (le .Values.cinder.dataCriticalPercent .Values.cinder.dataWarningPercent) (le .Values.cinder.metadataCriticalPercent .Values.cinder.metadataWarningPercent) -}}
{{- fail "Cinder critical thresholds must be greater than warning thresholds" -}}
{{- end -}}
