# Upstream values are nested under the dependency name.
node-problem-detector:
  image:
    repository: registry.k8s.io/node-problem-detector/node-problem-detector
    tag: v1.35.3
    # Multi-architecture OCI index digest published by registry.k8s.io.
    digest: sha256:b992945c77db8429e6f0b147fa8d59443773a1c0ff50d3dc3592230949720450
    pullPolicy: IfNotPresent

  # Use Linux kernel and systemd journal monitors. The Docker-specific monitor
  # is deliberately omitted for these containerd-based clusters.
  settings:
    log_monitors:
      - /config/kernel-monitor.json
      - /config/systemd-monitor.json
      - /config/readonly-monitor.json
    prometheus_address: 0.0.0.0
    prometheus_port: 20257

  # The upstream kernel and read-only filesystem monitors consume /dev/kmsg.
  # Delivery Hero's chart does not add this host device automatically.
  extraVolumes:
    - name: kmsg
      hostPath:
        path: /dev/kmsg
  extraVolumeMounts:
    - name: kmsg
      mountPath: /dev/kmsg
      readOnly: true

  # Reading host kernel and journal data requires the upstream privileged mode.
  securityContext:
    privileged: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Schedule on workers and tainted control-plane nodes.
  tolerations:
    - operator: Exists

  nodeSelector:
    kubernetes.io/os: linux

  updateStrategy: RollingUpdate
  maxUnavailable: 1

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      attachMetadata:
        node: true
    prometheusRule:
      enabled: true
      defaultRules:
        create: true
        # These rules cannot fire without the intentionally disabled Docker
        # monitor and would misrepresent the containerd deployment profile.
        disabled:
          - NodeProblemDockerHung
          - NodeProblemDockerContainerStartupFailure
          - NodeProblemCorruptDockerOverlay2
          - NodeProblemCorruptDockerImage
          - NodeProblemGaugeCorruptDockerOverlay2
          - NodeProblemGaugeDockerHung

# Wrapper-owned Helm test settings.
tests:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.36.2
    pullPolicy: IfNotPresent
